<title>Training Cards — Dwight Clarke — v2026-09-04</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161d18; --surface:#1f2a22; --surface2:#26332a; --line: rgba(237,232,220,0.12);
    --ivory:#EDE8DC; --ivory-dim: rgba(237,232,220,0.62);
    --brass:#C9A24B; --brass-dim: rgba(201,162,75,0.35);
    --sage:#7C9473; --pos:#8FB08A; --neg:#C1725A; --warn:#D9A25C;
  }
  body[data-theme="shade"]{
    --bg:#E4E1D4; --surface:#F1EFE4; --surface2:#DAD6C6; --line: rgba(20,24,18,0.16);
    --ivory:#20241C; --ivory-dim: rgba(32,36,28,0.66);
    --brass:#8A6415; --brass-dim: rgba(138,100,21,0.38);
    --sage:#3E6B41; --pos:#256B31; --neg:#A6371F; --warn:#9A6A17;
  }
  body[data-theme="sun"]{
    --bg:#FAFAF5; --surface:#FFFFFF; --surface2:#EFEDE2; --line: rgba(20,24,18,0.2);
    --ivory:#0F120C; --ivory-dim: rgba(15,18,12,0.72);
    --brass:#7A5A10; --brass-dim: rgba(122,90,16,0.42);
    --sage:#245A28; --pos:#166622; --neg:#8F2E19; --warn:#8A5A0E;
  }
  body[data-theme="shade"] .chip.active, body[data-theme="sun"] .chip.active{ color:#fff; }
  body[data-theme="shade"] .btn:not(.secondary):not(.ghost), body[data-theme="sun"] .btn:not(.secondary):not(.ghost){ color:#fff; }
  *{box-sizing:border-box;}
  html{width:100%; height:100%;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh; width:100%; -webkit-tap-highlight-color: transparent; padding-bottom:24px; transition:background 0.15s,color 0.15s;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:0.01em;}
  .brand{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand h1{font-size:21px; font-weight:600;}
  .brand .sub{font-size:12px; color:var(--ivory-dim); margin-top:2px;}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .board{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 12px; margin-bottom:16px;}
  .board h4{font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); font-family:'Inter',sans-serif; margin-bottom:8px;}
  .cat-row{display:grid; grid-template-columns:1fr auto auto; gap:2px 10px; font-size:16px; padding:6px 0; align-items:baseline; border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cname{color:var(--ivory-dim);}
  .cat-row .cval{font-size:18px; font-weight:600;}
  .cat-row .ctarget{font-size:13px; color:var(--ivory-dim);}
  .pos{color:var(--pos);} .neg{color:var(--neg);} .zero{color:var(--ivory-dim);} .warn{color:var(--warn);}
  .btn{display:block; width:100%; text-align:center; background:var(--brass); color:#1a1408; border:none; border-radius:9px; font-family:'Inter',sans-serif; font-weight:600; font-size:19px; padding:17px 18px; cursor:pointer; margin-top:10px;}

const CARD_ORDER = ['1','2','3','4','5','6','7','9','10'];
const DELOAD_NOTE = 'Deload Week active: cut to 2 sets per movement at ~60% of your usual top-set load. Bar speed should feel easy and fast on every rep.';
const ZONE2_TARGET = [150,180];

/* ================= State & storage ================= */
let sessions = [], dailyLogs = [];
const SESS_KEY='training_sessions_v1', DAILY_KEY='training_daily_v1', THEME_KEY='training_theme_v1';

async function loadState(){
  try{ const s = localStorage.getItem(SESS_KEY); sessions = s? JSON.parse(s):[]; }catch(e){ sessions=[]; }
  try{ const d = localStorage.getItem(DAILY_KEY); dailyLogs = d? JSON.parse(d):[]; }catch(e){ dailyLogs=[]; }
}
async function saveSessions(){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(sessions)); }catch(e){} }
async function saveDaily(){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyLogs)); }catch(e){} }
async function loadTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    const parsed = t? JSON.parse(t):null;
    document.body.setAttribute('data-theme', (parsed&&parsed.mode)||'sun');
  }catch(e){ document.body.setAttribute('data-theme','sun'); }
}
async function cycleTheme(){
  const order=['sun','shade','dark'];
  const cur = document.body.getAttribute('data-theme')||'sun';
  const next = order[(order.indexOf(cur)+1)%order.length];
  document.body.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, JSON.stringify({mode:next})); }catch(e){}
  render();
}
function themeToggleBtn(){
  const cur = document.body.getAttribute('data-theme')||'sun';
  const labels = {dark:'☾ Dusk', shade:'⛅ Shade', sun:'☀ Bright Sun'};
  return `<span onclick="cycleTheme()" class="themebtn">${labels[cur]}</span>`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ================= Derived stats ================= */
function daysAgo(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-n);
  return d >= cutoff;
}
function weeklyZone2(){
  let mins = 0;
  sessions.filter(s=>daysAgo(s.date,7)).forEach(s=>{ if(s.zone2Min) mins += Number(s.zone2Min); });
  dailyLogs.filter(d=>daysAgo(d.date,7)).forEach(d=>{ if(d.zone2Min) mins += Number(d.zone2Min); });
  return mins;
}
function recentReadiness(){
  const withReadiness = sessions.filter(s=>s.readiness!=null).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  return withReadiness.slice(0,3);
}
function shouldSwapToCard3(){
  const recent = recentReadiness().slice(0,2);
  return recent.length>=2 && recent.every(s=>s.readiness<6);
}
function lastSessionForCard(key){
  return sessions.filter(s=>s.cardKey===key).sort((a,b)=>b.ts-a.ts)[0] || null;
}
function lastLoggedSets(exName){
  // Cross-card: a repeated exercise (e.g. Single-Arm KB Clean & Press on Cards 2 & 5)
  // is tracked as one continuous progression, not reset per card.
  const past = sessions.slice().sort((a,b)=>b.ts-a.ts);
  for(const s of past){
    const ex = (s.exercises||[]).find(e=>e.name===exName);
    if(ex && ex.sets && ex.sets.length && ex.sets.some(st=>st.weight)) return {sets:ex.sets, date:s.date, cardKey:s.cardKey};
  }
  return null;
}
function firstSessionDate(){
  const dates = sessions.map(s=>s.date).sort();
  return dates.length? dates[0] : todayStr();
}
function currentTrainingWeek(){
  const first = new Date(firstSessionDate()+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const days = Math.floor((today-first)/(1000*60*60*24));
  return Math.floor(days/7)+1;
}
function isAutoDeloadWeek(){
  if(sessions.length===0) return false;
  return currentTrainingWeek()%5===0;
}
function openPicker(){ pickDeload = isAutoDeloadWeek(); view='pick'; render(); }
function last7DaysSessionCount(){ return sessions.filter(s=>daysAgo(s.date,7)).length; }

/* ================= Render ================= */

function render(){
  if(view==='home') return renderHome();

  if(view==='daily') return renderDaily();
  if(view==='detail') return renderDetail();
  if(view==='help') return renderHelp();
}

  const z = weeklyZone2();
  html += `<div class="board" style="margin-top:22px;">
    <h4>Zone 2 — Last 7 Days</h4>
    <div class="cat-row"><span class="cname">Minutes</span><span class="cval num ${z>=ZONE2_TARGET[0]?'pos':'zero'}">${z} min</span><span class="ctarget">target ${ZONE2_TARGET[0]}–${ZONE2_TARGET[1]}</span></div>
  </div>`;

  const readiness = recentReadiness();
  if(readiness.length){
    html += `<div class="board">
      <h4>Joint Readiness</h4>
      <div class="cat-row"><span class="cname">Latest</span><span class="cval num ${readiness[0].readiness<6?'warn':'zero'}">${readiness[0].readiness}/10</span><span class="ctarget">${readiness[0].date}</span></div>
    </div>`;
  }

  html += `<div class="board">
    <h4>Last 7 Days</h4>
    <div class="cat-row"><span class="cname">Sessions Logged</span><span class="cval num zero">${last7DaysSessionCount()}</span><span class="ctarget"></span></div>
  </div>`;

  html += `<h3 class="section-label">Past Sessions</h3>`;
  const allEntries = [
    ...sessions.map(s=>({...s, _type:'session'})),
    ...dailyLogs.map(d=>({...d, _type:'daily'}))
  ].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts-a.ts));
  if(allEntries.length===0){ html += `<div class="empty">Nothing logged yet.</div>`; }
  else{
    allEntries.slice(0,25).forEach(e=>{
      if(e._type==='session'){
        const c = CARDS[e.cardKey];
        html += `<div class="home-round" onclick="viewDetail('${e.id}','session')"><div><div>Card ${c.num} — ${c.name}${e.deload?' <span class="tag">Deload</span>':''}</div><div class="meta">${e.date}</div></div><div class="rval num">${e.readiness!=null?e.readiness+'/10':''}</div></div>`;
      } else {
        html += `<div class="home-round" onclick="viewDetail('${e.id}','daily')"><div><div>Daily Foundation</div><div class="meta">${e.date}</div></div><div class="rval num">${(e.items||[]).filter(Boolean).length}/4</div></div>`;
      }
    });
  }
  app.innerHTML = html;
}

function renderPick(){
  let html = `<div class="brand"><h1>Start Session</h1>${themeToggleBtn()}</div>`;
  const wk = currentTrainingWeek(), nextAuto = Math.ceil(wk/5)*5;
  html += `<div class="board"><h4>Deload Week</h4><div class="togglechip ${pickDeload?'active':''}" style="display:inline-block;" onclick="pickDeload=!pickDeload; render();">${pickDeload?'✓ Deload Active — 2 sets @ ~60%':'Normal Load'}</div><div class="hint" style="margin-top:8px;">Training week ${wk} — ${isAutoDeloadWeek()?'auto-flagged as a deload week (every 5th week). Toggle off if you\u2019d rather push through.':'auto-flag kicks in at week '+nextAuto+'. Toggle on any time you want one sooner.'}</div></div>`;
  CARD_ORDER.forEach(key=>{
    const c = CARDS[key];
    const last = lastSessionForCard(key);
    html += `<div class="card-pick" onclick="startSession('${key}')">
      <div class="cp-top"><span class="cp-name">${c.name}</span><span class="cp-num">CARD ${c.num}</span></div>
      <div class="cp-focus">${c.focus}</div>
      <div class="cp-meta">${c.meta}${last?' · last done '+last.date:''}</div>
    </div>`;
  });
  html += `<button class="btn secondary" onclick="goto('home')">Cancel</button>`;
  app.innerHTML = html;
}

function startSession(key){
  const c = CARDS[key];
  active = {
    id:'s'+Date.now(), ts:Date.now(), date:todayStr(), cardKey:key, deload:pickDeload,
    exercises:c.exercises.map(e=>({name:e.name, done:false, sets:[], note:'', logOpen:false})),
    readiness:null, zone2Min:'', notes:''
  };
  pickDeload=false;
  view='session'; render();
}

function renderSession(){
  const c = CARDS[active.cardKey];
  let html = `<div class="brand"><div><h1>Card ${c.num}</h1><div class="sub">${c.name}${active.deload?' · Deload':''}</div></div>${themeToggleBtn()}</div>`;

  if(active.deload && c.deloadable){
    html += `<div class="banner"><b>Deload:</b> ${DELOAD_NOTE}</div>`;
  }
  if(!c.deloadable && active.deload){
    html += `<div class="banner">This card isn\u2019t adjusted for deload weeks — run it as normal.</div>`;
  }

  active.exercises.forEach((ex,i)=>{
    const last = lastLoggedSets(ex.name);
    html += `<div class="exwrap ${ex.done?'done':''}">
      <div class="ex-top">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-presc">${c.exercises[i].presc}</div>
        </div>
        <div class="check ${ex.done?'on':''}" onclick="toggleExDone(${i})">${ex.done?'✓':''}</div>
      </div>
      <div class="ex-cue">${c.exercises[i].cue}</div>
      ${last?`<div class="ex-last">Last time (${last.date}${last.cardKey!==active.cardKey?', Card '+CARDS[last.cardKey].num:''}): ${last.sets.map(s=>`${s.weight||'?'}${typeof s.weight==='number'||!isNaN(parseFloat(s.weight))?' lb':''} × ${s.reps||'?'}`).join(', ')}</div>`:''}
      <span class="logtoggle" onclick="toggleLog(${i})">${ex.logOpen?'– hide weight log':'+ log weight / reps'}</span>
      ${ex.logOpen?renderSetRows(i,ex):''}
      <div class="sidenote"><input type="text" placeholder="L/R or form note (optional)" value="${ex.note}" oninput="active.exercises[${i}].note=this.value"></div>
    </div>`;
  });

  html += `<div class="golden"><b>Golden Rule.</b> ${c.golden}</div>`;

  html += `<div class="board"><h4>Joint Readiness (before/after)</h4><div class="slider-row">${[...Array(10)].map((_,n)=>`<div class="sn ${active.readiness===n+1?'active':''}" onclick="setReadiness(${n+1})">${n+1}</div>`).join('')}</div><div class="hint" style="margin-top:8px;">1 = beat up, 10 = fresh. Below 6 two sessions running → swap next lifting day to Card 3.</div></div>`;

  html += `<div class="field"><label>Zone 2 Minutes Today (optional)</label><input type="number" inputmode="numeric" value="${active.zone2Min}" placeholder="e.g. 45" oninput="active.zone2Min=this.value"></div>`;
  html += `<div class="field"><label>Session Notes (optional)</label><input type="text" value="${active.notes}" oninput="active.notes=this.value"></div>`;

  html += `<button class="btn" onclick="saveSession()">Save Session</button>`;
  html += `<button class="btn secondary" onclick="cancelSession()">Cancel</button>`;
  app.innerHTML = html;
}
function renderSetRows(i,ex){
  let h = `<div>`;
  ex.sets.forEach((s,j)=>{
    h += `<div class="setrow">
      <input type="number" inputmode="decimal" placeholder="lb" value="${s.weight}" oninput="active.exercises[${i}].sets[${j}].weight=this.value">
      <input type="number" inputmode="numeric" placeholder="reps" value="${s.reps}" oninput="active.exercises[${i}].sets[${j}].reps=this.value">
      <div class="rm" onclick="removeSet(${i},${j})">✕</div>
    </div>`;
  });
  h += `<button class="btn ghost small" style="margin-top:8px;" onclick="addSet(${i})">+ Add Set</button></div>`;
  return h;
}
function toggleExDone(i){ active.exercises[i].done = !active.exercises[i].done; render(); }
function toggleLog(i){ active.exercises[i].logOpen = !active.exercises[i].logOpen; if(active.exercises[i].logOpen && active.exercises[i].sets.length===0) active.exercises[i].sets.push({weight:'',reps:''}); render(); }
function addSet(i){ active.exercises[i].sets.push({weight:'',reps:''}); render(); }
function removeSet(i,j){ active.exercises[i].sets.splice(j,1); render(); }
function setReadiness(n){ active.readiness = n; render(); }
function cancelSession(){ active=null; goto('home'); }
async function saveSession(){
  sessions.push(active);
  active = null;
  await saveSessions();
  goto('home');
}

function renderDaily(){
  const today = todayStr();
  window._dailyDraft = window._dailyDraft || {date:today, items:[false,false,false,false], zone2Min:''};
  const d = window._dailyDraft;
  let html = `<div class="brand"><h1>Daily Foundation</h1>${themeToggleBtn()}</div>`;
  html += `<div class="field"><label>Date</label><input type="text" value="${d.date}" oninput="window._dailyDraft.date=this.value"></div>`;
  html += `<div class="board"><h4>Card 0 — Runs Every Day</h4>`;
  CARD0.forEach((b,i)=>{
    html += `<div class="blockrow" style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);"><div><div style="font-size:16px;">${b.name}</div><div style="font-size:13px; color:var(--ivory-dim);">${b.presc}</div></div><div class="togglechip ${d.items[i]?'active':''}" onclick="toggleDailyItem(${i})">${d.items[i]?'✓ Yes':'No'}</div></div>`;
  });
  html += `</div>`;
  html += `<div class="field"><label>Zone 2 Minutes Today (optional)</label><input type="number" inputmode="numeric" value="${d.zone2Min}" placeholder="e.g. 30" oninput="window._dailyDraft.zone2Min=this.value"></div>`;
  html += `<button class="btn" onclick="saveDailyEntry()">Save</button>`;
  html += `<button class="btn secondary" onclick="cancelDaily()">Cancel</button>`;
  app.innerHTML = html;
}
function toggleDailyItem(i){ window._dailyDraft.items[i] = !window._dailyDraft.items[i]; render(); }
function cancelDaily(){ window._dailyDraft=null; goto('home'); }
async function saveDailyEntry(){
  const d = window._dailyDraft;
  dailyLogs.push({id:'d'+Date.now(), ts:Date.now(), date:(d.date||todayStr()).trim(), items:[...d.items], zone2Min:d.zone2Min});
  window._dailyDraft = null;
  await saveDaily();
  goto('home');
}

function viewDetail(id, type){ window._detailId=id; window._detailType=type; view='detail'; render(); }
function renderDetail(){
  const id = window._detailId, type = window._detailType;
  let html = `<div class="brand"><h1>Entry Detail</h1>${themeToggleBtn()}</div>`;
  if(type==='session'){
    const s = sessions.find(x=>x.id===id);
    const c = CARDS[s.cardKey];
    html += `<div class="note" style="margin-top:-10px;">${s.date} · Card ${c.num} — ${c.name}${s.deload?' · Deload':''}</div>`;
    s.exercises.forEach(ex=>{
      html += `<div class="exwrap ${ex.done?'done':''}"><div class="ex-name">${ex.name}${ex.done?' ✓':''}</div>`;
      if(ex.sets && ex.sets.length && ex.sets.some(st=>st.weight||st.reps)){
        html += `<div class="ex-last" style="border-top:none; padding-top:4px;">${ex.sets.map(st=>`${st.weight||'?'} lb × ${st.reps||'?'}`).join(', ')}</div>`;
      }
      if(ex.note){ html += `<div class="ex-last">Note: ${ex.note}</div>`; }
      html += `</div>`;
    });
    if(s.readiness!=null) html += `<div class="board"><div class="cat-row"><span class="cname">Joint Readiness</span><span class="cval num ${s.readiness<6?'warn':'zero'}">${s.readiness}/10</span><span class="ctarget"></span></div></div>`;
    if(s.zone2Min) html += `<div class="board"><div class="cat-row"><span class="cname">Zone 2 Minutes</span><span class="cval num zero">${s.zone2Min}</span><span class="ctarget"></span></div></div>`;
    if(s.notes) html += `<div class="note">${s.notes}</div>`;
  } else {
    const d = dailyLogs.find(x=>x.id===id);
    html += `<div class="note" style="margin-top:-10px;">${d.date} · Daily Foundation</div>`;
    html += `<div class="board">${CARD0.map((b,i)=>`<div class="cat-row"><span class="cname">${b.name}</span><span class="cval num zero" style="font-size:15px;">${d.items[i]?'✓ Yes':'No'}</span><span class="ctarget"></span></div>`).join('')}</div>`;
    if(d.zone2Min) html += `<div class="board"><div class="cat-row"><span class="cname">Zone 2 Minutes</span><span class="cval num zero">${d.zone2Min}</span><span class="ctarget"></span></div></div>`;
  }
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:16px;">Back to Home</button>`;
  app.innerHTML = html;
}

function renderHelp(){
  const step = (n,title,body) => `<div class="board" style="padding:12px 14px;">
    <div style="display:flex; gap:10px; align-items:baseline; margin-bottom:6px;">
      <span class="num" style="color:var(--brass); font-weight:700; font-size:17px;">${n}</span>
      <span style="font-weight:600; font-size:16px;">${title}</span>
    </div>
    <div style="font-size:15px; color:var(--ivory-dim); line-height:1.55;">${body}</div>
  </div>`;
  let html = `<div class="brand"><h1>How to Use</h1>${themeToggleBtn()}</div>`;
  html += step('1','Card 0, once a day','Log Daily Foundation covers the vest walk, Crossover Symmetry, halos, and suitcase carry — the four things that run underneath whichever numbered card you\u2019re on. Log it once per day, separate from your numbered session.');
  html += step('2','Numbered sessions','Start Card Session, pick a card, and work through the exercise list top to bottom. Tap the circle when an exercise is done. Tap "+ log weight / reps" to record actual sets — that\u2019s what powers the "last time" hint on your next visit. Repeated exercises (like Single-Arm KB Clean & Press on Cards 2 & 5) are tracked as one continuous progression across cards, not reset per card.');
  html += step('3','Deload weeks','The picker auto-flags Deload Active every 5th training week, counted from your first logged session — toggle it off any time you\u2019d rather push through, or on early if you want one sooner. It only changes guidance on Cards 1, 2, 4, and 5 (2 sets @ ~60%) — Card 3\u2019s rotational throws and Card 6\u2019s Zone 2 stay as normal, per the program.');
  html += step('4','Joint readiness & Card 3 swap','Rate joints 1–10 in any session, especially before Card 7. If your last two ratings are both under 6, the home screen will flag that your next lifting day should swap to Card 3 instead of pushing through.');
  html += step('5','Zone 2 tally','Minutes logged in sessions and in Daily Foundation both count toward the rolling 7-day total shown on the home screen, against the 150–180 min weekly target.');
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:10px;">Back to Home</button>`;
  app.innerHTML = html;
}

function goto(v){ view=v; render(); }
loadTheme().then(()=>loadState().then(render));
</script>
</body>
</html>
