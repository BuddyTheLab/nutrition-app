<title>Training Cards — Dwight Clarke — v2026-09-21b</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161d18; --surface:#1f2a22; --surface2:#26332a; --line: rgba(237,232,220,0.12);
    --ivory:#EDE8DC; --ivory-dim: rgba(237,232,220,0.62);
    --brass:#C9A24B; --brass-dim: rgba(201,162,75,0.35);
    --sage:#7C9473; --pos:#8FB08A; --neg:#C1725A; --warn:#D9A25C;
  }
  body[data-theme="shade"]{
    --bg:#E4E1D4; --surface:#F1EFE4; --surface2:#DAD6C6; --line: rgba(20,24,18,0.16);
    --ivory:#20241C; --ivory-dim: rgba(32,36,28,0.66);
    --brass:#8A6415; --brass-dim: rgba(138,100,21,0.38);
    --sage:#3E6B41; --pos:#256B31; --neg:#A6371F; --warn:#9A6A17;
  }
  body[data-theme="sun"]{
    --bg:#FAFAF5; --surface:#FFFFFF; --surface2:#EFEDE2; --line: rgba(20,24,18,0.2);
    --ivory:#0F120C; --ivory-dim: rgba(15,18,12,0.72);
    --brass:#7A5A10; --brass-dim: rgba(122,90,16,0.42);
    --sage:#245A28; --pos:#166622; --neg:#8F2E19; --warn:#8A5A0E;
  }
  body[data-theme="hc"]{
    --bg:#000000; --surface:#0D0D0D; --surface2:#1A1A1A; --line: rgba(255,255,255,0.4);
    --ivory:#FFFFFF; --ivory-dim: rgba(255,255,255,0.92);
    --brass:#FFC72C; --brass-dim: rgba(255,199,44,0.55);
    --sage:#4ADE80; --pos:#4ADE80; --neg:#FF6B5C; --warn:#FFC72C;
  }
  body[data-theme="shade"] .chip.active, body[data-theme="sun"] .chip.active{ color:#fff; }
  body[data-theme="shade"] .btn:not(.secondary):not(.ghost), body[data-theme="sun"] .btn:not(.secondary):not(.ghost){ color:#fff; }
  *{box-sizing:border-box;}
  html{width:100%; height:100%;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh; width:100%; -webkit-tap-highlight-color: transparent; padding-bottom:24px; transition:background 0.15s,color 0.15s;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:0.01em;}
  .brand{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand h1{font-size:21px; font-weight:600;}
  .brand .sub{font-size:12px; color:var(--ivory-dim); margin-top:2px;}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .board{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 12px; margin-bottom:16px;}
  .board h4{font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); font-family:'Inter',sans-serif; margin-bottom:8px;}
  .cat-row{display:grid; grid-template-columns:1fr auto auto; gap:2px 10px; font-size:16px; padding:6px 0; align-items:baseline; border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cname{color:var(--ivory-dim);}
  .cat-row .cval{font-size:18px; font-weight:600;}

/* ================= State & storage ================= */
let sessions = [], dailyLogs = [];
const SESS_KEY='training_sessions_v1', DAILY_KEY='training_daily_v1', THEME_KEY='training_theme_v1';

async function loadState(){
  try{ const s = localStorage.getItem(SESS_KEY); sessions = s? JSON.parse(s):[]; }catch(e){ sessions=[]; }
  try{ const d = localStorage.getItem(DAILY_KEY); dailyLogs = d? JSON.parse(d):[]; }catch(e){ dailyLogs=[]; }
  try{ const sc = localStorage.getItem(SCHED_KEY); schedule = sanitizeSchedule(sc? JSON.parse(sc):null); }catch(e){ schedule = sanitizeSchedule(null); }
  try{ const p = localStorage.getItem(PREF_KEY); if(p) prefs = Object.assign({guided:true}, JSON.parse(p)); }catch(e){}
  try{
    const g = localStorage.getItem(PROG_KEY);
    if(g){ const pr=JSON.parse(g); if(pr && pr.active && pr.active.date===todayStr() && (Date.now()-pr.ts) < 12*3600*1000 && CARDS[pr.active.cardKey] && (pr.active.exercises||[]).every((e,i)=>CARDS[pr.active.cardKey].exercises[i] && CARDS[pr.active.cardKey].exercises[i].name===e.name)) resumeData=pr; else localStorage.removeItem(PROG_KEY); }
  }catch(e){ resumeData=null; }
}
async function saveSessions(){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(sessions)); }catch(e){} }
async function saveDaily(){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyLogs)); }catch(e){} }
async function loadTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    const parsed = t? JSON.parse(t):null;
    document.body.setAttribute('data-theme', (parsed&&parsed.mode)||'sun');
  }catch(e){ document.body.setAttribute('data-theme','sun'); }
}
async function cycleTheme(){
  const order=['sun','shade','dark','hc'];
  const cur = document.body.getAttribute('data-theme')||'sun';
  const next = order[(order.indexOf(cur)+1)%order.length];
  document.body.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, JSON.stringify({mode:next})); }catch(e){}
  render();
}
function themeToggleBtn(){
  const cur = document.body.getAttribute('data-theme')||'sun';
  const labels = {dark:'☾ Dusk', shade:'⛅ Shade', sun:'☀ Bright Sun', hc:'◐ High Contrast'};
  return `<span onclick="cycleTheme()" class="themebtn">${labels[cur]}</span>`;
}
function todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

/* ================= Derived stats ================= */
function daysAgo(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-n);
  return d >= cutoff;
}
function weeklyZone2(){
  let mins = 0;
  sessions.filter(s=>daysAgo(s.date,7)).forEach(s=>{ if(s.zone2Min) mins += Number(s.zone2Min); });
  dailyLogs.filter(d=>daysAgo(d.date,7)).forEach(d=>{ if(d.zone2Min) mins += Number(d.zone2Min); });
  return mins;
}
function recentReadiness(){
  const withReadiness = sessions.filter(s=>s.readiness!=null).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  return withReadiness.slice(0,3);
}
function shouldSwapToCard3(){
  const recent = recentReadiness().slice(0,2);
  return recent.length>=2 && recent.every(s=>s.readiness<6);
}
function lastSessionForCard(key){
  return sessions.filter(s=>s.cardKey===key).sort((a,b)=>b.ts-a.ts)[0] || null;
}
function lastLoggedSets(exName){
  // Cross-card: a repeated exercise (e.g. Single-Arm KB Clean & Press on Cards 2 & 5)
  // is tracked as one continuous progression, not reset per card.
  const past = sessions.slice().sort((a,b)=>b.ts-a.ts);
  for(const s of past){
    const ex = (s.exercises||[]).find(e=>e.name===exName);
    if(ex && ex.sets && ex.sets.length && ex.sets.some(st=>st.weight||st.reps||st.time)) return {sets:ex.sets, date:s.date, cardKey:s.cardKey, note:ex.note||''};
  }
  return null;
}
function firstSessionDate(){
  const dates = sessions.map(s=>s.date).sort();
  return dates.length? dates[0] : todayStr();
}
function currentTrainingWeek(){
  const first = new Date(firstSessionDate()+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const days = Math.floor((today-first)/(1000*60*60*24));
  return Math.floor(days/7)+1;
}
function isAutoDeloadWeek(){
  if(sessions.length===0) return false;
  return currentTrainingWeek()%5===0;
}
function openPicker(){ pickDeload = isAutoDeloadWeek(); view='pick'; render(); }
function last7DaysSessionCount(){ return sessions.filter(s=>daysAgo(s.date,7)).length; }

/* ================= Render ================= */
const app = document.getElementById('app');
let view='home', pickDeload=false, active=null; // active session in progress

function render(){
  saveProgress();
  if(view==='guided') return renderGuided();
  if(view==='schedule') return renderSchedule();
  if(view==='home') return renderHome();
  if(view==='pick') return renderPick();
  if(view==='session') return renderSession();
  if(view==='daily') return renderDaily();
  if(view==='detail') return renderDetail();
  if(view==='help') return renderHelp();
}

function renderHome(){
  let html = `<div class="brand"><div><h1>Training Cards</h1><div class="sub">10-card resistance program · ${APP_VERSION}</div></div>${themeToggleBtn()}</div>`;

  if(shouldSwapToCard3()){
    html += `<div class="banner"><b>Card 7 rule triggered:</b> joint readiness has been below 6 for two sessions in a row. Next lifting day should be a Card 3 swap, not a push.</div>`;
  }

  if(resumeData && !active){
    const rc=CARDS[resumeData.active.cardKey];
    html += `<div class="banner"><b>Session in progress:</b> Card ${rc.num} — ${rc.name}.<div class="gbtns" style="margin-top:10px;"><button class="btn small" onclick="resumeSession()">Resume</button><button class="btn secondary small" onclick="discardResume()">Discard</button></div></div>`;
  }
  html += todayBoardHtml();
  html += `<button class="btn secondary" onclick="openPicker()">Start a Different Card</button>`;
  html += `<button class="btn secondary" onclick="goto('daily')">Log Daily Foundation (Card 0)</button>`;
  html += `<button class="btn secondary" onclick="goto('help')">How to Use</button>`;

  const z = weeklyZone2();
  html += `<div class="board" style="margin-top:22px;">
    <h4>Zone 2 — Last 7 Days</h4>
    <div class="cat-row"><span class="cname">Minutes</span><span class="cval num ${z>=ZONE2_TARGET[0]?'pos':'zero'}">${z} min</span><span class="ctarget">target ${ZONE2_TARGET[0]}–${ZONE2_TARGET[1]}</span></div>
  </div>`;

  const readiness = recentReadiness();
  if(readiness.length){
    html += `<div class="board">
      <h4>Joint Readiness</h4>
      <div class="cat-row"><span class="cname">Latest</span><span class="cval num ${readiness[0].readiness<6?'warn':'zero'}">${readiness[0].readiness}/10</span><span class="ctarget">${readiness[0].date}</span></div>
    </div>`;
  }

  html += `<div class="board">
    <h4>Last 7 Days</h4>
    <div class="cat-row"><span class="cname">Sessions Logged</span><span class="cval num zero">${last7DaysSessionCount()}</span><span class="ctarget"></span></div>
  </div>`;

  html += `<h3 class="section-label">Past Sessions</h3>`;
  const allEntries = [
    ...sessions.map(s=>({...s, _type:'session'})),
    ...dailyLogs.map(d=>({...d, _type:'daily'}))
  ].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts-a.ts));
  if(allEntries.length===0){ html += `<div class="empty">Nothing logged yet.</div>`; }
  else{
    allEntries.slice(0,25).forEach(e=>{
      if(e._type==='session'){
        const c = CARDS[e.cardKey];
        html += `<div class="home-round" onclick="viewDetail('${e.id}','session')"><div><div>Card ${c.num} — ${c.name}${e.deload?' <span class="tag">Deload</span>':''}</div><div class="meta">${e.date}</div></div><div class="rval num">${e.readiness!=null?e.readiness+'/10':''}</div></div>`;
      } else {
        html += `<div class="home-round" onclick="viewDetail('${e.id}','daily')"><div><div>Daily Foundation</div><div class="meta">${e.date}</div></div><div class="rval num">${(e.items||[]).filter(Boolean).length}/4</div></div>`;
      }
    });
  }
  app.innerHTML = html;
}

function renderPick(){
  let html = `<div class="brand"><h1>Start Session</h1>${themeToggleBtn()}</div>`;
  const wk = currentTrainingWeek(), nextAuto = Math.ceil(wk/5)*5;
  html += `<div class="board"><h4>Deload Week</h4><div class="togglechip ${pickDeload?'active':''}" style="display:inline-block;" onclick="pickDeload=!pickDeload; render();">${pickDeload?'✓ Deload Active — 2 sets @ ~60%':'Normal Load'}</div><div class="hint" style="margin-top:8px;">Training week ${wk} — ${isAutoDeloadWeek()?'auto-flagged as a deload week (every 5th week). Toggle off if you\u2019d rather push through.':'auto-flag kicks in at week '+nextAuto+'. Toggle on any time you want one sooner.'}</div></div>`;
  html += guidedToggleHtml();
  CARD_ORDER.forEach(key=>{
    const c = CARDS[key];
    const last = lastSessionForCard(key);
    html += `<div class="card-pick" onclick="startSession('${key}')">
      <div class="cp-top"><span class="cp-name">${c.name}</span><span class="cp-num">CARD ${c.num}</span></div>
      <div class="cp-focus">${c.focus}</div>
      <div class="cp-meta">${c.meta}${last?' · last done '+last.date:''}</div>
    </div>`;
  });
  html += `<button class="btn secondary" onclick="goto('home')">Cancel</button>`;
  app.innerHTML = html;
}

function startSession(key){
  formShown={};
  if(prefs.guided){ const dl=pickDeload; pickDeload=false; startGuided([key], dl); return; }
  active = makeActive(key, pickDeload);
  pickDeload=false;
  view='session'; render();
}

function renderSession(){
  const c = CARDS[active.cardKey];
  let html = `<div class="brand"><div><h1>Card ${c.num}</h1><div class="sub">${c.name}${active.deload?' · Deload':''}</div></div>${themeToggleBtn()}</div>`;

  if(active.deload && c.deloadable){
    html += `<div class="banner"><b>Deload:</b> ${DELOAD_NOTE}</div>`;
  }
  if(!c.deloadable && active.deload){
    html += `<div class="banner">This card isn\u2019t adjusted for deload weeks — run it as normal.</div>`;
  }

  active.exercises.forEach((ex,i)=>{
    const last = lastLoggedSets(ex.name);
    html += `<div class="exwrap ${ex.done?'done':''}">
      <div class="ex-top">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-presc">${c.exercises[i].presc}</div>
        </div>
        <div class="check ${ex.done?'on':''}" onclick="toggleExDone(${i})">${ex.done?'✓':''}</div>
      </div>
      <div class="ex-cue">${c.exercises[i].cue}</div>
      ${formHtml(ex.name)}
      ${last?`<div class="ex-last">Last time (${last.date}${last.cardKey!==active.cardKey?', Card '+CARDS[last.cardKey].num:''}): ${last.sets.map(fmtSet).join(', ')}${last.note?' \u00b7 '+esc(last.note):''}</div>`:''}
      ${restBtnHtml(i)}${logToggleHtml(i)}
      ${ex.logOpen?renderSetRows(i,ex):''}
      <div class="sidenote"><input type="text" placeholder="${notePH(ex.name)}" value="${esc(ex.note)}" oninput="active.exercises[${i}].note=this.value"></div>
    </div>`;
  });

  html += `<div class="golden"><b>Golden Rule.</b> ${c.golden}</div>`;

  html += `<div class="board"><h4>Joint Readiness (before/after)</h4><div class="slider-row">${[...Array(10)].map((_,n)=>`<div class="sn ${active.readiness===n+1?'active':''}" onclick="setReadiness(${n+1})">${n+1}</div>`).join('')}</div><div class="hint" style="margin-top:8px;">1 = beat up, 10 = fresh. Below 6 two sessions running → swap next lifting day to Card 3.</div></div>`;

  html += `<div class="field"><label>Zone 2 Minutes Today (optional)</label><input type="number" inputmode="numeric" value="${active.zone2Min}" placeholder="e.g. 45" oninput="active.zone2Min=this.value"></div>`;
  html += `<div class="field"><label>Session Notes (optional)</label><input type="text" value="${esc(active.notes)}" oninput="active.notes=this.value"></div>`;

  html += `<button class="btn" onclick="saveSession()">Save Session</button>`;
  html += `<button class="btn secondary" onclick="cancelSession()">Cancel</button>`;
  app.innerHTML = html;
}
function toggleExDone(i){ active.exercises[i].done = !active.exercises[i].done; render(); }
function toggleLog(i){ active.exercises[i].logOpen = !active.exercises[i].logOpen; if(active.exercises[i].logOpen && active.exercises[i].sets.length===0) active.exercises[i].sets.push({weight:'',reps:''}); render(); }
function addSet(i){ active.exercises[i].sets.push({weight:'',reps:''}); render(); }
function removeSet(i,j){ active.exercises[i].sets.splice(j,1); render(); }
function setReadiness(n){ active.readiness = n; render(); }
function cancelSession(){ active=null; stopTimer(); clearProgress(); goto('home'); }
async function saveSession(){
  sessions.push(active);
  active = null;
  stopTimer(); clearProgress();
  await saveSessions();
  goto('home');
}

function renderDaily(){
  const today = todayStr();
  window._dailyDraft = window._dailyDraft || {date:today, items:[false,false,false,false], zone2Min:''};
  const d = window._dailyDraft;
  let html = `<div class="brand"><h1>Daily Foundation</h1>${themeToggleBtn()}</div>`;
  html += `<div class="field"><label>Date</label><input type="text" value="${d.date}" oninput="window._dailyDraft.date=this.value"></div>`;
  html += `<div class="board"><h4>Card 0 — Runs Every Day</h4>`;
  CARD0.forEach((b,i)=>{
    html += `<div class="blockrow" style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);"><div><div style="font-size:16px;">${b.name}</div><div style="font-size:13px; color:var(--ivory-dim);">${b.presc}</div></div><div class="togglechip ${d.items[i]?'active':''}" onclick="toggleDailyItem(${i})">${d.items[i]?'✓ Yes':'No'}</div></div>`;
  });
  html += `</div>`;
  html += `<div class="field"><label>Zone 2 Minutes Today (optional)</label><input type="number" inputmode="numeric" value="${d.zone2Min}" placeholder="e.g. 30" oninput="window._dailyDraft.zone2Min=this.value"></div>`;
  html += `<button class="btn" onclick="saveDailyEntry()">Save</button>`;
  html += `<button class="btn secondary" onclick="cancelDaily()">Cancel</button>`;
  app.innerHTML = html;
}
function toggleDailyItem(i){ window._dailyDraft.items[i] = !window._dailyDraft.items[i]; render(); }
function cancelDaily(){ window._dailyDraft=null; goto('home'); }
async function saveDailyEntry(){
  const d = window._dailyDraft;
  dailyLogs.push({id:'d'+Date.now(), ts:Date.now(), date:(d.date||todayStr()).trim(), items:[...d.items], zone2Min:d.zone2Min});
  window._dailyDraft = null;
  await saveDaily();
  goto('home');
}

function viewDetail(id, type){ window._detailId=id; window._detailType=type; view='detail'; render(); }
function renderDetail(){
  const id = window._detailId, type = window._detailType;
  let html = `<div class="brand"><h1>Entry Detail</h1>${themeToggleBtn()}</div>`;
  if(type==='session'){
    const s = sessions.find(x=>x.id===id);
    const c = CARDS[s.cardKey];
    html += `<div class="note" style="margin-top:-10px;">${s.date} · Card ${c.num} — ${c.name}${s.deload?' · Deload':''}</div>`;
    s.exercises.forEach(ex=>{
      html += `<div class="exwrap ${ex.done?'done':''}"><div class="ex-name">${ex.name}${ex.done?' ✓':''}</div>`;
      if(ex.sets && ex.sets.length && ex.sets.some(st=>st.weight||st.reps||st.time)){
        html += `<div class="ex-last" style="border-top:none; padding-top:4px;">${ex.sets.map(fmtSet).join(', ')}</div>`;
      }
      if(ex.note){ html += `<div class="ex-last">Note: ${esc(ex.note)}</div>`; }
      html += `</div>`;
    });
    if(s.readiness!=null) html += `<div class="board"><div class="cat-row"><span class="cname">Joint Readiness</span><span class="cval num ${s.readiness<6?'warn':'zero'}">${s.readiness}/10</span><span class="ctarget"></span></div></div>`;
    if(s.zone2Min) html += `<div class="board"><div class="cat-row"><span class="cname">Zone 2 Minutes</span><span class="cval num zero">${s.zone2Min}</span><span class="ctarget"></span></div></div>`;
    if(s.notes) html += `<div class="note">${esc(s.notes)}</div>`;
  } else {
    const d = dailyLogs.find(x=>x.id===id);
    html += `<div class="note" style="margin-top:-10px;">${d.date} · Daily Foundation</div>`;
    html += `<div class="board">${CARD0.map((b,i)=>`<div class="cat-row"><span class="cname">${b.name}</span><span class="cval num zero" style="font-size:15px;">${d.items[i]?'✓ Yes':'No'}</span><span class="ctarget"></span></div>`).join('')}</div>`;
    if(d.zone2Min) html += `<div class="board"><div class="cat-row"><span class="cname">Zone 2 Minutes</span><span class="cval num zero">${d.zone2Min}</span><span class="ctarget"></span></div></div>`;
  }
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:16px;">Back to Home</button>`;
  app.innerHTML = html;
}

function renderHelp(){
  const step = (n,title,body) => `<div class="board" style="padding:12px 14px;">
    <div style="display:flex; gap:10px; align-items:baseline; margin-bottom:6px;">
      <span class="num" style="color:var(--brass); font-weight:700; font-size:17px;">${n}</span>
      <span style="font-weight:600; font-size:16px;">${title}</span>
    </div>
    <div style="font-size:15px; color:var(--ivory-dim); line-height:1.55;">${body}</div>
  </div>`;
  let html = `<div class="brand"><h1>How to Use</h1>${themeToggleBtn()}</div>`;
  html += step('1','Card 0, once a day','Log Daily Foundation covers the vest walk, Crossover Symmetry, halos, and suitcase carry — the four things that run underneath whichever numbered card you\u2019re on. Log it once per day, separate from your numbered session.');
  html += step('2','Today\u2019s Card','The home screen shows what your weekly schedule calls for today. Tap Start and the app walks you through it. On days with more than one card (a lift plus ATG, for example) the cards run back to back. The starting schedule is a default — tap Edit Weekly Schedule and set it to match your real week. If your last two joint ratings were under 6, you can swap today\u2019s lift to Card 3 with one tap.');
  html += step('3','Guided walk-through','One exercise at a time, with the prescription, the cue, and your last logged numbers on screen. Enter weight and reps for each set (optional — on bodyweight moves, weight means added weight, so leave it blank for plain bodyweight), tap Set done, and the rest timer starts on its own. Tap Show form under any ATG or McGill move to see its diagram. At the end of each card, rate your joints and save. Weights you log power the last-time hint on your next visit. On a deload week, sets are capped at 2 per movement. If the phone reloads the page mid-session, a Resume button waits for you on the home screen.');
  html += step('4','Rest timer','Counts down the rest listed on the card and beeps when it is up. For a range like 2–3 min it beeps at the low end and keeps running, so you can go when ready. Med ball throws use a stopwatch for full recovery. Use −15 and +15 to adjust, and Skip to dismiss. The app asks your phone to keep the screen awake during sessions. If the phone locks anyway, the beep cannot play, but the time is still right when you come back.');
  html += step('5','Full list view','Prefer the whole card at once? Tap Start a Different Card, switch Walk-through to Full list view, and work top to bottom. Tap the circle when an exercise is done, tap the Rest button on any exercise for its timer, and tap + log weight / reps to record sets. Repeated exercises (like Single-Arm KB Clean & Press on Cards 2 & 5) are tracked as one continuous progression across cards, not reset per card.');
  html += step('6','Deload weeks','Today\u2019s Card and the card picker auto-flag Deload every 5th training week, counted from your first logged session — toggle it off any time you\u2019d rather push through, or on early if you want one sooner. It only changes guidance on Cards 1, 2, 4, and 5 (2 sets @ ~60%) — Card 3\u2019s rotational throws and Card 6\u2019s Zone 2 stay as normal, per the program.');
  html += step('7','Joint readiness & Card 3 swap','Rate joints 1–10 at the end of any session, especially before Card 7. If your last two ratings are both under 6, the home screen will flag that your next lifting day should swap to Card 3 instead of pushing through.');
  html += step('8','Zone 2 tally','Minutes logged in sessions and in Daily Foundation both count toward the rolling 7-day total shown on the home screen, against the 150–180 min weekly target.');
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:10px;">Back to Home</button>`;
  app.innerHTML = html;
}

/* ================= Version, schedule & preferences ================= */
const APP_VERSION = 'v2026-09-21b';
const SCHED_KEY='training_schedule_v1', PREF_KEY='training_prefs_v1', PROG_KEY='training_inprogress_v1';
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_ORDER=[1,2,3,4,5,6,0];
const LIFT_CARDS=['1','2','4','5'];
const DEFAULT_SCHEDULE={0:['7'],1:['1','9','10'],2:['2'],3:['3','9','10'],4:['4'],5:['5','9','10'],6:['6']};
let schedule=null, prefs={guided:true}, resumeData=null;
let swapToday=false, todayDeload=null, schedDraft=null;

function sanitizeSchedule(sc){
  const out={};
  for(let d=0; d<7; d++){
    const arr = (sc && Array.isArray(sc[d])) ? sc[d] : DEFAULT_SCHEDULE[d];
    out[d] = CARD_ORDER.filter(k=>arr.indexOf(k)!==-1);
  }
  return out;
}
async function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }

/* ================= In-progress snapshot (resume after the phone reloads the page) ================= */
function saveProgress(){
  try{
    if(active && (view==='guided' || view==='session')){
      localStorage.setItem(PROG_KEY, JSON.stringify({v:1, ts:Date.now(), view:view, active:active, guided:guided}));
    }
  }catch(e){}
}
function clearProgress(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} resumeData=null; }
function resumeSession(){
  if(!resumeData) return;
  active=resumeData.active; guided=resumeData.guided; view=resumeData.view; resumeData=null;
  if(guided){ if(!guided.draft) guided.draft=blankDraft(); if(guided.draft.time===undefined) guided.draft.time=''; }
  keepAwake(true); render(); window.scrollTo(0,0);
}
function discardResume(){ clearProgress(); render(); }

/* ================= Today's Card ================= */
function todayKeys(){
  const base = (schedule[new Date().getDay()] || []).slice();
  if(!swapToday) return base;
  const out=[];
  base.forEach(k=>{ const kk = LIFT_CARDS.indexOf(k)!==-1 ? '3' : k; if(out.indexOf(kk)===-1) out.push(kk); });
  return out;
}
function doneToday(key){ const t=todayStr(); return sessions.some(s=>s.date===t && s.cardKey===key); }
function todayDeloadOn(){ return todayDeload===null ? isAutoDeloadWeek() : todayDeload; }
function todayBoardHtml(){
  const keys=todayKeys(), baseKeys=(schedule[new Date().getDay()]||[]);
  const day=DAY_NAMES[new Date().getDay()];
  let h=`<div class="board today"><h4>Today · ${day}</h4>`;
  if(!keys.length){ h+=`<div class="hint">Nothing scheduled today. Pick a card below, or edit the weekly schedule.</div>`; }
  keys.forEach(k=>{
    const c=CARDS[k], done=doneToday(k);
    h+=`<div class="tc-row ${done?'done':''}"><div><div class="tc-name">${c.name}</div><div class="tc-meta">Card ${c.num} · ${c.meta}</div></div><div class="tc-state">${done?'✓ Done':''}</div></div>`;
  });
  if(keys.length){

  let chips='';
  if(anyDeloadable){ chips+=`<div class="togglechip ${todayDeloadOn()?'active':''}" onclick="todayDeload=!todayDeloadOn(); render();">${todayDeloadOn()?'✓ Deload week':'Normal load'}</div>`; }

  h+=`<button class="btn ghost" style="margin-top:12px;" onclick="openSchedule()">Edit Weekly Schedule</button>`;
  h+=`</div>`;
  return h;
}

/* ================= Rest timer ================= */
let timer=null, timerIv=null, audioCtx=null, wakeLock=null;

function restInfo(presc){
  if(/full recovery/i.test(presc)) return {mode:'stopwatch', lo:0, hi:0};
  const m=presc.match(/rest\s*(\d+)\s*(?:[–-]\s*(\d+))?\s*(min|sec|s)\b/i);
  if(m){
    const mult=/^min/i.test(m[3])?60:1;
    const lo=parseInt(m[1],10)*mult, hi=m[2]?parseInt(m[2],10)*mult:lo;
    return {mode:'count', lo:lo, hi:hi};
  }
  if(/mini-sets/i.test(presc)) return {mode:'count', lo:15, hi:15};
  return null;
}
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function restLabel(r){
  if(r.mode==='stopwatch') return 'Recovery stopwatch';
  return r.hi>r.lo ? 'Rest '+fmtTime(r.lo)+'–'+fmtTime(r.hi) : 'Rest '+fmtTime(r.lo);
}
function ensureAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx=new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    ensureAudio();
    if(audioCtx){
      const t0=audioCtx.currentTime;
      [0,0.28,0.56].forEach((dt,i)=>{
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='sine'; o.frequency.value = i===2 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001,t0+dt);
        g.gain.exponentialRampToValueAtTime(0.35,t0+dt+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0+dt); o.stop(t0+dt+0.22);
      });
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}
async function keepAwake(on){
  try{
    if(on){
      if(!wakeLock && navigator.wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
      }
    } else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && (active || timer)) keepAwake(true);
  if(timer) tickTimer();
});

function startRestNamed(name, presc){
  const r=restInfo(presc);
  if(!r) return;
  ensureAudio();
  timer={name:name, mode:r.mode, lo:r.lo, hi:r.hi, start:Date.now(), fired:false};
  if(timerIv) clearInterval(timerIv);
  timerIv=setInterval(tickTimer,250);
  keepAwake(true);
  renderTimerBar();
}
function startRestFor(i){
  const ce=CARDS[active.cardKey].exercises[i];
  startRestNamed(ce.name, ce.presc);
}
function stopTimer(){
  timer=null;
  if(timerIv){ clearInterval(timerIv); timerIv=null; }
  renderTimerBar();
  if(!active) keepAwake(false);
}
function nudgeTimer(d){
  if(!timer || timer.mode!=='count') return;
  timer.lo=Math.max(5,timer.lo+d);
  timer.hi=Math.max(timer.lo,timer.hi+d);
  timer.fired = ((Date.now()-timer.start)/1000) >= timer.lo;
  tickTimer();
}
function timerText(){
  const el=(Date.now()-timer.start)/1000;
  if(timer.mode==='stopwatch') return {t:fmtTime(el), ready:false, sub:'full recovery — go when ready'};
  const rem=timer.lo-el;
  if(rem>0) return {t:fmtTime(Math.ceil(rem)), ready:false, sub: timer.hi>timer.lo ? 'up to '+fmtTime(timer.hi) : ''};
  return {t:'+'+fmtTime(-rem), ready:true, sub:'ready'};
}
function tickTimer(){
  if(!timer) return;
  const r=timerText();
  if(r.ready && !timer.fired){ timer.fired=true; beep(); }
  const t=document.getElementById('tb-time'), s=document.getElementById('tb-sub'), b=document.getElementById('timerbar');
  if(t) t.textContent=r.t;
  if(s) s.textContent=r.sub;
  if(b) b.classList.toggle('ready', r.ready);
}
function renderTimerBar(){
  const b=document.getElementById('timerbar');
  if(!b) return;
  if(!timer){ b.innerHTML=''; b.className=''; document.body.classList.remove('has-timer'); return; }
  document.body.classList.add('has-timer');
  b.className='timerbar';
  b.innerHTML=`<div class="tb-info"><div class="tb-label">${timer.mode==='stopwatch'?'Recover':'Rest'} · ${timer.name}</div><div class="tb-line"><span class="tb-time num" id="tb-time"></span><span class="tb-sub" id="tb-sub"></span></div></div><div class="tb-btns">${timer.mode==='count'?'<button class="tb-btn" onclick="nudgeTimer(-15)">−15</button><button class="tb-btn" onclick="nudgeTimer(15)">+15</button>':''}<button class="tb-btn go" onclick="stopTimer()">${timer.mode==='stopwatch'?'Done':'Skip'}</button></div>`;
  tickTimer();
}
function restBtnHtml(i){
  const r=restInfo(CARDS[active.cardKey].exercises[i].presc);
  if(!r) return '';
  return `<span class="logtoggle" style="margin-right:18px;" onclick="startRestFor(${i})">⏱ ${restLabel(r)}</span>`;
}

const LOG_TYPES = {

  'Bottom-Quarter Pull-Up':'bw', 'Sticking-Point Negative (Middle Block)':'bw',
  'Top-Quarter Partial Pull-Up (Top Block \u00b7 priority)':'bw',
  'Inverted Bodyweight Skull Crushers':'bw', 'Deficit Push-Ups (Myo-Reps)':'bw', 'Inverted Bodyweight Rows':'bw',
  'Tibialis Raise':'bw', 'Patrick Step-Up':'bw', 'Patrick Step':'bw', 'FHL Calf Raise':'bw', 'KOT Calf Raise':'bw',
  'Sticking-Point Iso Hold':'secs', 'L-Sit (Pike Progression)':'secs',
  'Passive Hanging / Decompression':'mins', 'Warm-Up: Backward Walking':'mins',

  'McGill Big Three, Endurance Dose':'none', 'Light Mobility':'none', 'McGill Big Three (light)':'none'
};
function logType(name){ return LOG_TYPES[name] || 'load'; } // load = weight + reps; bw = reps + optional added weight; reps; secs; mins; none
function blankDraft(){ return {weight:'', reps:'', time:''}; }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const NOTE_PH = {'Inverted Bodyweight Skull Crushers':'Bar height or angle, L/R or form note (optional)', 'Inverted Bodyweight Rows':'Bar height or angle, L/R or form note (optional)', 'Deficit Push-Ups (Myo-Reps)':'Deficit height, L/R or form note (optional)'};
function notePH(name){ return NOTE_PH[name] || 'L/R or form note (optional)'; }
function hasVal(v){ return v!==undefined && v!==null && String(v)!==''; }
function fmtSet(s){
  const w=hasVal(s.weight)?String(s.weight):'', r=hasVal(s.reps)?String(s.reps):'', t=hasVal(s.time)?String(s.time):'';
  const lb = (w && !isNaN(parseFloat(w))) ? (s.bw?'+':'')+w+' lb' : w;
  if(t) return t+' '+(s.unit||'sec');
  if(w && r) return lb+' \u00d7 '+r;
  if(w) return lb;
  if(r) return r+' reps';
  return '';
}
function logWord(type){ return (type==='load'||type==='bw') ? 'weight / reps' : (type==='reps' ? 'reps' : 'time'); }
function logToggleHtml(i){

let guided=null; // {queue:[cardKeys], qi:card index, ei:-1 intro | 0..n-1 exercise | n wrap-up, si:set index, extra, draft, deload}

function makeActive(key, deload){
  const c=CARDS[key];
  return {
    id:'s'+Date.now(), ts:Date.now(), date:todayStr(), cardKey:key, deload:!!deload,
    exercises:c.exercises.map(e=>({name:e.name, done:false, sets:[], note:'', logOpen:false})),
    readiness:null, zone2Min:'', notes:''
  };
}
function startGuided(queue, deload){
  formShown={};
  guided={queue:queue.slice(), qi:0, ei:-1, si:0, extra:0, draft:blankDraft(), deload:!!deload};
  active=makeActive(queue[0], !!deload);
  view='guided';
  keepAwake(true);
  render(); window.scrollTo(0,0);
}
function gCard(){ return CARDS[guided.queue[guided.qi]]; }
function gDeloadEff(){ return guided.deload && gCard().deloadable; }
function setPlan(presc, cap){
  let n=1, labels=null, m;
  if((m=presc.match(/(\d+)-(\d+)-(\d+)\s*pyramid/i))){
    n=3; labels=[m[1],m[2],m[3]].map(x=>x+(x==='1'?' rep':' reps')+' · 10s holds');
  } else if(/mini-sets/i.test(presc)){
    const mm=presc.match(/(\d+)(?:–\d+)?\s*mini-sets/i);
    const minis=mm?parseInt(mm[1],10):3;
    n=1+minis; labels=['Activation set'];
    for(let i=1;i<=minis;i++) labels.push('Mini-set '+i+' of '+minis);
  } else if((m=presc.match(/^(\d+)(?:–\d+)?\s*[×x]/))){
    n=parseInt(m[1],10);
  } else if((m=presc.match(/^(\d+)\s+easy sets/i))){
    n=parseInt(m[1],10);
  }
  if(cap && n>2){ n=2; if(labels) labels=labels.slice(0,2); }
  return {n:n, labels:labels};
}
function gPlan(){
  const ce=gCard().exercises[guided.ei];
  const p=setPlan(ce.presc, gDeloadEff());
  return {n:p.n+guided.extra, labels:p.labels};
}
function renderGuided(){
  const n=gCard().exercises.length;

  h+=`<div class="field"><label>Zone 2 Minutes Today (optional)</label><input type="number" inputmode="numeric" value="${active.zone2Min}" placeholder="e.g. 45" oninput="active.zone2Min=this.value"></div>`;
  h+=`<div class="field"><label>Session Notes (optional)</label><input type="text" value="${esc(active.notes)}" oninput="active.notes=this.value"></div>`;
  h+=`<button class="btn" onclick="gSaveCard()">${more?'Save & continue to Card '+CARDS[guided.queue[guided.qi+1]].num:'Save & finish'}</button>`;
  h+=`<button class="btn secondary" onclick="gDiscard()">Discard this card</button>`;
  app.innerHTML=h;
}
function gResetPos(){ guided.si=0; guided.extra=0; guided.draft=blankDraft(); }
function gBegin(){ guided.ei=0; gResetPos(); render(); window.scrollTo(0,0); }
function gUseLast(){
  const last=lastLoggedSets(gCard().exercises[guided.ei].name);
  if(!last) return;
  const s=last.sets[Math.min(guided.si,last.sets.length-1)];
  guided.draft={weight:hasVal(s.weight)?String(s.weight):'', reps:hasVal(s.reps)?String(s.reps):'', time:hasVal(s.time)?String(s.time):''};
  render();
}
function gAddSet(){ guided.extra++; render(); }
function gSetDone(){
  const c=gCard(), i=guided.ei, ce=c.exercises[i], ex=active.exercises[i], d=guided.draft, plan=gPlan(), type=logType(ce.name);
  if(hasVal(d.weight) || hasVal(d.reps) || hasVal(d.time)){
    const rec={weight:d.weight||'', reps:d.reps||''};
    if(type==='bw'){ if(hasVal(d.weight) && parseFloat(d.weight)!==0) rec.bw=true; else rec.weight=''; }
    if(hasVal(d.time)){ rec.time=d.time; rec.unit = type==='mins' ? 'min' : 'sec'; }
    ex.sets.push(rec);
  }
  const finished = guided.si>=plan.n-1, isLastEx = i===c.exercises.length-1;
  guided.draft=blankDraft();
  if(finished){
    ex.done=true; guided.si=0; guided.extra=0; guided.ei++;
    if(!isLastEx) startRestNamed(ce.name, ce.presc); else stopTimer();
  } else {
    guided.si++;
    startRestNamed(ce.name, ce.presc);
  }
  render(); window.scrollTo(0,0);
}
function gSkipEx(){ gResetPos(); guided.ei++; render(); window.scrollTo(0,0); }
function gPrev(){
  if(guided.ei<=0) return;
  guided.ei--; guided.extra=0; guided.draft=blankDraft();
  guided.si=gPlan().n-1;
  render(); window.scrollTo(0,0);
}
function gEndCard(){ gResetPos(); guided.ei=gCard().exercises.length; stopTimer(); render(); window.scrollTo(0,0); }
function gNextCard(){
  guided.qi++; guided.ei=-1; gResetPos();
  active=makeActive(guided.queue[guided.qi], guided.deload);
  render(); window.scrollTo(0,0);
}
async function gSaveCard(){
  sessions.push(active);
  await saveSessions();
  if(guided.qi<guided.queue.length-1){ gNextCard(); }
  else { active=null; guided=null; stopTimer(); clearProgress(); goto('home'); window.scrollTo(0,0); }
}
function gSkipCard(){ if(guided.qi<guided.queue.length-1) gNextCard(); else gCancel(); }
function gDiscard(){
  if(!confirm('Discard this card without saving?')) return;
  if(guided.qi<guided.queue.length-1){ gNextCard(); }
  else { active=null; guided=null; stopTimer(); clearProgress(); goto('home'); }
}
function gCancel(){ active=null; guided=null; stopTimer(); clearProgress(); goto('home'); window.scrollTo(0,0); }

function guidedToggleHtml(){
  return `<div class="board"><h4>Walk-through</h4><div class="togglechip ${prefs.guided?'active':''}" style="display:inline-block;" onclick="toggleGuidedPref()">${prefs.guided?'✓ Guided, one exercise at a time':'Full list view'}</div><div class="hint" style="margin-top:8px;">${prefs.guided?'Steps through each exercise with set tracking and an automatic rest timer.':'Shows the whole card as one list. Rest timers are one tap per exercise.'}</div></div>`;
}
function toggleGuidedPref(){ prefs.guided=!prefs.guided; render(); savePrefs(); }

function formKey(name){ return FORM[name] ? FORM[name].join('+') : null; }
function formHtml(name){
  const k=formKey(name); if(!k) return '';
  const open=!!formShown[k];
  let h=`<div><span class="formtoggle" onclick="toggleForm('${k}')">${open?'\u25be Hide form':'\u25b8 Show form'}</span></div>`;
  if(open) h+=FORM[name].map(id=>`<img class="formimg" src="${FORM_IMG[id]}" alt="${FORM_ALT[id]}">`).join('');
  return h;
}
function toggleForm(k){ formShown[k]=!formShown[k]; render(); }

function goto(v){ view=v; render(); }
