<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Cards">
<meta name="theme-color" content="#f6f3ec">
<title>Training Cards · Dwight Clarke · v2026-11-03c</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#17202b;--muted:#5b6675;--line:#e2dccd;--navy:#1f3a5f;--accent:#c2562b;--good:#3f7a3a;--soft:#efe9dc;--warn:#9c6b14}
@media (prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1d232b;--ink:#eef1f4;--muted:#9aa5b2;--line:#2e3742;--navy:#8fb3e0;--accent:#e58a5f;--good:#7cc072;--soft:#252d37;--warn:#e0b25c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:28px;line-height:1.15;margin:4px 0 2px}
h2{font-size:21px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.chip{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.dl{background:var(--warn);color:#fff}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
input[type=number],input[type=text],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=number]{max-width:120px;text-align:center}
textarea{min-height:70px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--soft);color:var(--ink)}
button.small{padding:7px 12px;font-size:16px;border-radius:10px}
button.wide{width:100%;margin-top:10px}
.tick{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.tick:first-of-type{border-top:0}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.tick.on .box{background:var(--good);border-color:var(--good)}
.tick .t{font-weight:600}
.tick .d{color:var(--muted);font-size:16px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.scale button{padding:9px 0;background:var(--soft);color:var(--ink);font-size:17px;border-radius:8px}
.scale button.on{background:var(--navy);color:#fff}
.hint{font-size:16px;color:var(--muted);margin-top:6px}
.note{font-size:16px;background:var(--soft);border-radius:10px;padding:9px 11px;margin-top:8px}
.note.warn{border-left:4px solid var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.acts button{background:var(--soft);color:var(--ink);padding:9px 12px;font-size:16px}
.act{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.act .n{flex:1;font-weight:600}
.x{background:none;color:var(--muted);padding:6px 10px;font-size:20px}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--muted);font-size:15px;padding:8px 0;border-radius:10px}
nav button.on{color:var(--navy);background:var(--soft)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.ex .h{display:flex;gap:10px;align-items:baseline}
.ex .num{font-weight:800;color:var(--muted);min-width:34px}
.ex .ttl{font-weight:700;flex:1}
.ex .ds{color:var(--muted);font-size:16px;margin:2px 0 0 44px}
.ex .last{color:var(--muted);font-size:15px;margin:2px 0 0 44px}
.sets{margin:8px 0 0 44px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center}
.set input{max-width:none;padding:9px 6px}
.set .ok{width:44px;height:44px;padding:0;border-radius:10px;background:var(--soft);color:var(--muted);font-size:20px}
.set .ok.on{background:var(--good);color:#fff}
.set .lbl{color:var(--muted);font-size:15px;text-align:center}
.info{margin:8px 0 0 44px;font-size:16px;background:var(--soft);border-radius:10px;padding:10px 12px}
.info ol{margin:4px 0 6px;padding-left:20px}
.info .cue{font-weight:800;margin-top:6px}
.grp{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.doneall{margin-left:44px;margin-top:8px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer b{font-size:28px;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.2);padding:8px 12px}
table.wk{width:100%;border-collapse:collapse;font-size:16px}
table.wk td,table.wk th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.wk th{color:var(--muted);font-weight:600;font-size:14px;border-top:0}
table.wk tr.today td{font-weight:700}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:17px}
.stat b{text-align:right}
.mrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;cursor:pointer}
.mrow .r{margin-left:auto;font-weight:700;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 120px;gap:8px 10px;align-items:center;font-size:17px}
.form input{max-width:none}
svg.chart{width:100%;height:auto;display:block}
.back{background:none;color:var(--navy);padding:6px 0;font-weight:700}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:14px;text-align:center;margin:20px 0 8px}
details summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:16px;margin-top:8px}
</style>
</head>

  const wk = weekKeys(0), mins = cardioMin(wk);
  h += `<div class="card"><h2>Activity</h2><div class="acts">${ACTS.map(([n,m],j)=>`<button onclick="addAct(${j})">${n}</button>`).join('')}</div>
  ${(d.acts||[]).map((a,j)=>`<div class="act"><span class="n">${esc(a.t)}</span><input type="number" inputmode="numeric" value="${esc(a.min)}" onchange="actMin(${j},this.value)" style="max-width:90px"> <span class="sub">min</span><button class="x" onclick="delAct(${j})">×</button></div>`).join('')}
  <div class="bar"><i style="width:${Math.min(100,Math.round(mins/D.targets.cardio[0]*100))}%"></i></div>
  <div class="hint">${mins} min this week · my floor is ${D.targets.cardio[0]}–${D.targets.cardio[1]}</div></div>`;
  // nutrition
  h += `<div class="card"><h2>Nutrition</h2><div class="sub">Protein ${D.targets.protein} · fluids ${D.targets.fluids}</div>
  ${D.nutrition.map((b,j)=>tickRow(d.nut[j], `tog('nut',${j})`, b.block, b.time, `<details onclick="event.stopPropagation()"><summary>What’s in it</summary><div class="hint">${b.items.map(esc).join('<br>')}</div></details>`)).join('')}
  ${tickRow(d.nut.fl, "tog('nut','fl')", 'Fluids', D.targets.fluids)}</div>`;
  h += `<div class="card"><h2>Note</h2><textarea placeholder="Anything worth remembering" onchange="setv('note',this.value)">${esc(d.note||'')}</textarea></div>`;
  return h;
}
function tickRow(on, act, t, ds, extra){ return `<div class="tick ${on?'on':''}" onclick="${act}"><span class="box">${on?'✓':''}</span><div class="sp"><div class="t">${esc(t)}</div><div class="d">${esc(ds||'')}</div>${extra||''}</div></div>`; }
function setv(f, v){ const d = day(todayKey()); d[f] = (f==='ready') ? v : (v===''?null:(f==='note'?v:+v)); save(); render(); }
function tog(g, id){ const d = day(todayKey()); d[g][id] = !d[g][id]; save(); render(); }
function addAct(j){ const d = day(todayKey()); d.acts.push({ t: ACTS[j][0], min: ACTS[j][1] }); save(); render(); }
function actMin(j, v){ const d = day(todayKey()); d.acts[j].min = +v || 0; save(); render(); }
function delAct(j){ const d = day(todayKey()); d.acts.splice(j,1); save(); render(); }
function pickCard(v){ const d = day(todayKey()); d.cards = v ? v.split(',') : null; if(!v) delete d.cards; save(); render(); }

// ---------- SESSION ----------
function sessionItems(cs){ const out = []; cs.forEach(c => { const it = D.items[c] || []; if(it.length){ if(cs.length>1 || c==='9'||c==='10') out.push({ group: 'Card '+c+' · '+D.cards[c].short, top: c }); it.forEach(x => out.push(Object.assign({card:c}, x))); } }); return out; }
function itemDone(d, x){ if(x.kind === 'tick') return !!(d.done||{})[x.id]; return ((d.sets||{})[x.id]||[]).filter(s=>s&&s.ok).length >= nSets(x); }
function nSets(x){ return isDeload(todayKey()) ? Math.min(2, x.sets[0]) : x.sets[0]; }
function earned(){ const k = todayKey(); return !isDeload(k) && ((peek(k)||{}).ready||0) >= 7; }
function session(){
  const k = todayKey(), d = day(k), cs = cardsFor(k), all = sessionItems(cs);
  let h = `<button class="back" onclick="go('today')">‹ Today</button><h1>${esc(cardTitle(cs))}</h1><div class="sub">${esc(D.cards[cs[0]].sub)}</div>`;
  if(cs.includes('6')) h += '<div class="note">My walk, golf round or 4×4 goes under Activity on the Today page.</div>';
  let n = 0, inCard = false; const openCard = () => { if(!inCard){ h += '<div class="card">'; inCard = true; } }, closeCard = () => { if(inCard){ h += '</div>'; inCard = false; } };
  all.forEach(x => {
    if(x.group){ closeCard(); h += x.top ? `<h2 style="margin-top:18px"><span class="dot" style="background:${D.cards[x.top].color}"></span>${esc(x.group)}</h2>` : `<div class="grp">${esc(x.group)}</div>`; return; }
    openCard();
    n++; const e = D.ex[x.ex] || null, id = x.id, isOpen = open[id];
    h += `<div class="ex"><div class="h"><span class="num">${n}</span><span class="ttl">${esc(x.label)}</span>${e?`<button class="small ghost" onclick="flip('${id}')">${isOpen?'Hide':'How'}</button>`:''}</div>
    <div class="ds">${esc(x.dose)}</div>`;
    if(isOpen && e) h += `<div class="info">${e.sub?`<div class="hint" style="margin:0 0 4px">${esc(e.sub)}</div>`:''}<ol>${e.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${e.check?`<div>${esc(e.check)}</div>`:''}${e.cue?`<div class="cue">${esc(e.cue)}</div>`:''}<div class="hint">Binder page ${esc(x.ref)}</div></div>`;
    if(x.kind === 'tick'){
      const on = !!(d.done||{})[id];
      h += `<div class="doneall"><button class="${on?'':'ghost'}" style="${on?'background:var(--good)':''}" onclick="tickEx('${id}')">${on?'✓ Done':'Mark done'}</button></div>`;
    } else {
      const last = lastSets(id, k), cnt = nSets(x), a = (d.sets[id] = d.sets[id] || []);
      while(a.length < cnt) a.push(null);
      if(last) h += `<div class="last">Last time (${fmt(last.k)}): ${last.a.map(s=>(s.lb?s.lb+' lb × ':'')+(s.r||'—')).join(', ')}</div>`;
      h += `<div class="sets"><div class="set"><span></span><span class="lbl">${x.bw?'':'lb'}</span><span class="lbl">reps</span><span></span></div>`;
      a.forEach((s,j) => { s = s || {}; const pl = last && last.a[Math.min(j,last.a.length-1)] || {};
        h += `<div class="set"><span class="lbl">${j+1}</span>${x.bw?'<span class="lbl">bodyweight</span>':`<input type="number" inputmode="decimal" placeholder="${esc(pl.lb||'')}" value="${esc(s.lb||'')}" onchange="setSet('${id}',${j},'lb',this.value)">`}<input type="number" inputmode="numeric" placeholder="${esc(pl.r||'')}" value="${esc(s.r||'')}" onchange="setSet('${id}',${j},'r',this.value)"><button class="ok ${s.ok?'on':''}" onclick="okSet('${id}',${j},${x.rest||0})">✓</button></div>`; });
      h += `</div>${a.length < x.sets[1] && earned() ? `<div class="doneall"><button class="small ghost" onclick="moreSet('${id}')">+ 3rd set (earned)</button></div>` : ''}`;
    }
    h += '</div>';
  });
  closeCard(); h += '<button class="wide" onclick="go(\'today\')">Finished · back to Today</button><div class="hint" style="text-align:center">Then one calm minute of slow breathing, long exhales.</div>';
  return h;
}
function flip(id){ open[id] = !open[id]; render(); }
function tickEx(id){ const d = day(todayKey()); d.done[id] = !d.done[id]; save(); render(); }
function setSet(id,j,f,v){ const d = day(todayKey()); d.sets[id][j] = d.sets[id][j] || {}; d.sets[id][j][f] = v===''?null:+v; save(); }
function okSet(id,j,rest){ const d = day(todayKey()); const a = d.sets[id]; a[j] = a[j] || {}; const pl = (lastSets(id, todayKey())||{a:[]}).a[j] || {};
  if(!a[j].ok){ if(a[j].lb==null && pl.lb) a[j].lb = pl.lb; if(a[j].r==null && pl.r) a[j].r = pl.r; a[j].ok = true; save(); render(); if(rest && j < a.length-1) startRest(rest); }
  else { a[j].ok = false; save(); render(); } }
function moreSet(id){ const d = day(todayKey()); d.sets[id].push(null); save(); render(); }

// ---------- WEEK ----------
function week(){
  const ks = weekKeys(weekOff), t = todayKey();
  let h = `<div class="top"><button class="small ghost" onclick="weekOff--;render()">‹</button><h1 class="sp" style="text-align:center">Week of ${fromKey(ks[0]).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</h1><button class="small ghost" onclick="weekOff++;render()" ${weekOff>=0?'disabled':''}>›</button></div>
  <div class="sub" style="text-align:center">${planWeek(ks[0])>0?'Week '+planWeek(ks[0])+' · '+phase(ks[0]):''}${isDeload(ks[0])?' · deload':''}</div>
  <div class="card"><table class="wk"><tr><th>Day</th><th>Card</th><th>Card 0</th><th>Min</th><th>lb</th></tr>`;
  ks.forEach(k => { const d = peek(k)||{}, c0 = Object.values(d.c0||{}).filter(Boolean).length, m = (d.acts||[]).reduce((a,x)=>a+(+x.min||0),0);
    h += `<tr class="${k===t?'today':''}"><td>${DAYN[dow(k)]}</td><td>${lifted(k)?'✓ ':''}${esc(cardsFor(k).filter(c=>c!=='10').join('+').replace('9','ATG'))}</td><td>${c0?'✓':''}</td><td>${m||''}</td><td>${d.weight||''}</td></tr>`; });
  const mins = cardioMin(ks), lifts = ks.filter(liftDay).length, w = ks.map(k=>(peek(k)||{}).weight).filter(Boolean), avg = w.length ? (w.reduce((a,b)=>a+b,0)/w.length).toFixed(1) : '—';
  const pw = weekKeys(weekOff-1).map(k=>(peek(k)||{}).weight).filter(Boolean), pavg = pw.length ? pw.reduce((a,b)=>a+b,0)/pw.length : null;
  const c0days = ks.filter(k=>Object.values((peek(k)||{}).c0||{}).some(Boolean)).length, walks = ks.filter(k=>((peek(k)||{}).acts||[]).length).length;
  const minOk = lifts >= 2 && c0days >= 5 && walks >= 5;
  h += `</table></div><div class="card"><h2>This week</h2><div class="stat">
  <span>Lifting days</span><b>${lifts}</b><span>Cardio minutes</span><b>${mins} / ${D.targets.cardio[0]}–${D.targets.cardio[1]}</b>
  <span>Card 0 days</span><b>${c0days} / 7</b><span>Average weight</span><b>${avg}${pavg&&avg!=='—'?` (${(avg-pavg>0?'+':'')}${(avg-pavg).toFixed(1)})`:''}</b></div>
  <div class="note">${minOk?'✓ My minimum week is in: daily five minutes, my walks and two lifting days.':'My minimum week: daily five minutes, my walks and two lifting days. A missed day: I pick up where I left off.'}</div></div>`;
  return h;
}

// ---------- PROGRESS ----------
function progress(){
  const pts = Object.keys(S.days).sort().filter(k => S.days[k].weight).map(k => [k, S.days[k].weight]);
  let h = '<h1>Progress</h1><div class="sub">Lean mass held, fat down, strength holding.</div>';
  h += `<div class="card"><h2>Weight</h2>${chart(pts.slice(-90))}<div class="hint">${pts.length?'Latest '+pts[pts.length-1][1]+' lb · ':''}target ${D.targets.weight[0]}–${D.targets.weight[1]} lb, about 0.5–1 lb a week</div>`;
  const ws = Object.keys(S.days).sort().filter(k=>S.days[k].waist).map(k=>[k,S.days[k].waist]);
  if(ws.length){ const l = ws[ws.length-1]; h += `<div class="hint">Waist ${l[1]} in (${fmt(l[0])}) · waist-to-height ${(l[1]/D.targets.heightIn).toFixed(3)}, target under 0.50</div>`; }
  h += '</div>';
  // checkpoint
  const ck = open.ck || {};
  h += `<div class="card"><h2>Checkpoint</h2><div class="sub">Every deload week · weeks 5, 10, 15, 20</div>
  ${S.checks.slice().reverse().map(c=>`<div class="mrow"><span>${fmt(c.date)}</span><span class="r">${['partials','balance','brisk','tgu','srt','bp','ldl'].filter(f=>c[f]).map(f=>esc(c[f])).join(' · ')}</span></div>`).join('')}
  <details ${isDeload(todayKey())?'open':''}><summary>Log a checkpoint</summary><div class="form" style="margin-top:8px">
  ${[['partials','Top-quarter partials, reps'],['balance','Single-leg balance, sec (weaker leg)'],['brisk','Brisk 3 minutes, laps'],['tgu','Get-up phase, 1–5'],['srt','Sitting-rising test, 0–10'],['bp','Blood pressure'],['ldl','LDL (target under 50)']].map(([f,l])=>`<span>${l}</span><input type="${f==='bp'?'text':'number'}" inputmode="decimal" value="${esc(ck[f]||'')}" onchange="ckSet('${f}',this.value)">`).join('')}
  </div><button class="wide" onclick="ckSave()">Save checkpoint</button></details></div>`;
  // dexa
  const dx = open.dx || {}, b = D.dexaBase;
  h += `<div class="card"><h2>DEXA</h2><div class="sub">Success: lean mass at or above ${b.lean} lb, fat mass down</div>
  <div class="mrow" style="display:block"><b>${fmt(b.date)} · baseline</b><br><span class="sub">${b.total} lb · lean ${b.lean} · fat ${b.fat} · ${b.bf}%</span></div>
  ${S.dexa.map(x=>`<div class="mrow" style="display:block"><b>${fmt(x.date)}</b><br><span class="sub">${x.total||'—'} lb · lean ${x.lean||'—'} · fat ${x.fat||'—'} · ${x.bf||'—'}%</span></div>`).join('')}
  <details><summary>Log a scan</summary><div class="form" style="margin-top:8px"><span>Date</span><input type="date" value="${esc(dx.date||todayKey())}" onchange="dxSet('date',this.value)">
  ${[['total','Total weight, lb'],['lean','Lean mass, lb'],['fat','Fat mass, lb'],['bf','Body fat %']].map(([f,l])=>`<span>${l}</span><input type="number" inputmode="decimal" value="${esc(dx[f]||'')}" onchange="dxSet('${f}',this.value)">`).join('')}
  </div><button class="wide" onclick="dxSave()">Save scan</button></details></div>`;
  h += `<div class="card"><h2>Backup</h2><div class="sub">My log lives on this phone. A backup now and then keeps it safe.</div>
  <button class="wide ghost" onclick="exportData()">Save a backup to Files</button><label class="hint" style="display:block;margin-top:10px">Restore from a backup: <input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label></div>`;
  return h;
}
function chart(pts){
  if(pts.length < 2) return '<div class="hint">My weight trend appears here after two weigh-ins.</div>';
  const W = 520, H = 230, p = 40, vals = pts.map(x=>x[1]).concat(D.targets.weight), lo = Math.floor(Math.min(...vals)-1), hi = Math.ceil(Math.max(...vals)+1);
  const t0 = fromKey(pts[0][0]).getTime(), t1 = fromKey(pts[pts.length-1][0]).getTime() || t0+1;
  const X = k => p + (fromKey(k).getTime()-t0)/Math.max(1,t1-t0)*(W-2*p), Y = v => H-p - (v-lo)/(hi-lo)*(H-2*p);
  const band = `<rect x="${p}" y="${Y(D.targets.weight[1])}" width="${W-2*p}" height="${Y(D.targets.weight[0])-Y(D.targets.weight[1])}" fill="var(--good)" opacity=".15"/>`;
  const line = pts.map((x,i)=>(i?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${band}<text x="${p}" y="${Y(D.targets.weight[1])-4}" font-size="20" fill="var(--muted)">target ${D.targets.weight[0]}–${D.targets.weight[1]}</text>
  <text x="2" y="${Y(hi)+12}" font-size="20" fill="var(--muted)">${hi}</text><text x="2" y="${Y(lo)}" font-size="20" fill="var(--muted)">${lo}</text>
  <path d="${line}" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>${pts.map(x=>`<circle cx="${X(x[0]).toFixed(1)}" cy="${Y(x[1]).toFixed(1)}" r="3" fill="var(--navy)"/>`).join('')}</svg>`;
}
function ckSet(f,v){ open.ck = open.ck || {}; open.ck[f] = v; }
function ckSave(){ const c = Object.assign({ date: todayKey() }, open.ck||{}); S.checks = S.checks.filter(x=>x.date!==c.date).concat([c]).sort((a,b)=>a.date<b.date?-1:1); open.ck = null; save(); render(); }
function dxSet(f,v){ open.dx = open.dx || {}; open.dx[f] = v; }
function dxSave(){ const x = Object.assign({ date: todayKey() }, open.dx||{}); S.dexa = S.dexa.filter(y=>y.date!==x.date).concat([x]).sort((a,b)=>a.date<b.date?-1:1); open.dx = null; save(); render(); }
async function exportData(){ const name = 'Training_Log_Backup_'+todayKey()+'.json', blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  try{ const f = new File([blob], name, {type:'application/json'}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function importData(f){ if(!f) return; const r = new FileReader(); r.onload = () => { try{ const x = JSON.parse(r.result); if(!x.days) throw 0; if(confirm('Replace this phone’s log with the backup from '+f.name+'?')){ S = x; S.checks = S.checks||[]; S.dexa = S.dexa||[]; save(); render(); } }catch(e){ alert('That file is not a Training Log backup.'); } }; r.readAsText(f); }

// ---------- CARDS ----------
function cardsView(){
  if(viewArg && viewArg.ex) return exView(viewArg.ex);
  if(viewArg && viewArg.card != null) return cardView(viewArg.card);
  let h = '<h1>My Cards</h1><div class="sub">Every card, exercise, dose and cue</div><div class="card">';
  Object.keys(D.cards).forEach(k => { const c = D.cards[k]; h += `<div class="mrow" onclick="go('cards',{card:'${k}'})"><span class="dot" style="background:${c.color}"></span><span><b>${k} · ${esc(c.short)}</b><br><span class="sub">${esc(c.when)} · ${esc(c.time)}</span></span><span class="r">›</span></div>`; });
  h += `</div><div class="card"><h2>My Week</h2>${D.week.map(w=>`<div class="mrow"><b style="min-width:44px">${w.day.slice(0,3)}</b><span>${esc(w.title)}<br><span class="sub">${esc(w.note)}</span></span></div>`).join('')}</div>
  <div class="card"><h2>My Rules</h2>${D.rules.map(r=>`<div class="mrow" style="display:block;cursor:default"><b>${esc(r[0])}</b><div class="sub">${esc(r[1])}</div></div>`).join('')}</div>`;
  return h;
}
function cardView(k){
  const c = D.cards[k];
  let h = `<button class="back" onclick="go('cards')">‹ Cards</button><h1><span class="dot" style="background:${c.color}"></span> ${k} · ${esc(c.name)}</h1><div class="sub">${esc(c.when)} · ${esc(c.time)} · ${esc(c.sub)}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}<div class="card">`;
  c.map.forEach(r => { if(r.group){ h += `<div class="grp">${esc(r.group)}</div>`; return; } const id = (r.ref||'').split('–')[0]; const has = D.ex[id];
    h += `<div class="mrow" ${has?`onclick="go('cards',{ex:'${id}',from:'${k}'})"`:''}><span><b>${esc(r.label)}</b><br><span class="sub">${esc(r.dose||'')}</span></span><span class="r">${esc(r.ref||'')}${has?' ›':''}</span></div>`; });
  return h + `</div>${c.rule?`<div class="note"><b>Golden rule</b> ${esc(c.rule)}</div>`:''}`;
}
function exView(id){
  const e = D.ex[id];
  return `<button class="back" onclick="go('cards',{card:'${viewArg.from||e.card}'})">‹ Card ${viewArg.from||e.card}</button><h1>${esc(e.id)} · ${esc(e.title)}</h1><div class="sub">${esc(e.sub)}</div>
  <div class="card"><b>${esc(e.dose)}</b>${e.doses.map(d=>`<div class="hint"><b>${esc(d[0])}</b> ${esc(d[1])}</div>`).join('')}<ol>${e.steps.map(s=>`<li style="margin:6px 0">${esc(s)}</li>`).join('')}</ol>${e.check?`<div class="note">${esc(e.check)}</div>`:''}${e.cue?`<h2 style="margin-top:12px">${esc(e.cue)}</h2>`:''}</div>`;
}

// ---------- shell ----------
const TABS = [['today','Today'],['week','Week'],['progress','Progress'],['cards','Cards']];
function go(v, arg){ view = v; viewArg = arg || null; render(); window.scrollTo(0,0); }
function render(){
  const a = document.getElementById('app');
  a.innerHTML = (view==='today'?today():view==='session'?session():view==='week'?week():view==='progress'?progress():cardsView()) + `<div class="foot">Training Cards · v2026-11-03c</div>`;
  document.getElementById('nav').innerHTML = TABS.map(([v,l])=>`<button class="${view===v||(v==='today'&&view==='session')?'on':''}" onclick="go('${v}')">${l}</button>`).join('');
  save();
}
let lastDay = todayKey();
document.addEventListener('visibilitychange', () => { if(!document.hidden && todayKey() !== lastDay){ lastDay = todayKey(); go('today'); } });
render();
</script>
