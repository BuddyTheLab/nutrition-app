<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrition & Workout">
<title>Nutrition & Workout Log — Dwight Clarke — Updated 8/31/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161d18; --surface:#1f2a22; --surface2:#26332a; --line: rgba(237,232,220,0.12);
    --ivory:#EDE8DC; --ivory-dim: rgba(237,232,220,0.62);
    --brass:#C9A24B; --brass-dim: rgba(201,162,75,0.35);
    --sage:#7C9473; --pos:#8FB08A; --neg:#C1725A;
  }
  body[data-theme="shade"]{
    --bg:#E4E1D4; --surface:#F1EFE4; --surface2:#DAD6C6; --line: rgba(20,24,18,0.16);
    --ivory:#20241C; --ivory-dim: rgba(32,36,28,0.66);
    --brass:#8A6415; --brass-dim: rgba(138,100,21,0.38);
    --sage:#3E6B41; --pos:#256B31; --neg:#A6371F;
  }
  body[data-theme="sun"]{
    --bg:#FAFAF5; --surface:#FFFFFF; --surface2:#EFEDE2; --line: rgba(20,24,18,0.2);
    --ivory:#0F120C; --ivory-dim: rgba(15,18,12,0.72);
    --brass:#7A5A10; --brass-dim: rgba(122,90,16,0.42);
    --sage:#245A28; --pos:#166622; --neg:#8F2E19;
  }
  body[data-theme="hc"]{
    --bg:#000000; --surface:#0D0D0D; --surface2:#1A1A1A; --line: rgba(255,255,255,0.4);
    --ivory:#FFFFFF; --ivory-dim: rgba(255,255,255,0.92);
    --brass:#FFC72C; --brass-dim: rgba(255,199,44,0.55);
    --sage:#4ADE80; --pos:#4ADE80; --neg:#FF6B5C;
  }
  body[data-theme="shade"] .chip.active, body[data-theme="sun"] .chip.active{ color:#fff; }
  body[data-theme="shade"] .btn:not(.secondary):not(.ghost), body[data-theme="sun"] .btn:not(.secondary):not(.ghost){ color:#fff; }
  *{box-sizing:border-box;}
  html{width:100%; height:100%;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh; width:100%; -webkit-tap-highlight-color: transparent; padding-bottom:24px; transition:background 0.15s,color 0.15s;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:0.01em;}
  .brand{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand h1{font-size:22px; font-weight:600;}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .board{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 12px; margin-bottom:16px;}
  .board h4{font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); font-family:'Inter',sans-serif; margin-bottom:8px;}
  .cat-row{display:grid; grid-template-columns:1fr auto auto; gap:2px 10px; font-size:16px; padding:6px 0; align-items:baseline; border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cname{color:var(--ivory-dim);}
  .cat-row .cval{font-size:18px; font-weight:600;}
  .cat-row .ctarget{font-size:13px; color:var(--ivory-dim);}
  .pos{color:var(--pos);} .neg{color:var(--neg);} .zero{color:var(--ivory-dim);}
  .btn{display:block; width:100%; text-align:center; background:var(--brass); color:#1a1408; border:none; border-radius:9px; font-family:'Inter',sans-serif; font-weight:600; font-size:19px; padding:17px 18px; cursor:pointer; margin-top:10px;}
  .btn:active{opacity:0.85;}
  .btn.secondary{background:transparent; color:var(--ivory); border:1px solid var(--line);}
  .btn.ghost{background:transparent; color:var(--brass); border:1px solid var(--brass-dim); padding:12px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ivory-dim); margin-bottom:6px;}
  .field input[type=text], .field input[type=number]{ width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--ivory); border-radius:8px; padding:14px 12px; font-size:19px; font-family:'IBM Plex Mono',monospace;}
  .field .hint{font-size:13px; color:var(--ivory-dim); margin-top:5px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{flex:1 1 auto; min-width:60px; text-align:center; padding:13px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--ivory-dim); font-size:16px; font-weight:600; cursor:pointer;}
  .chip.active{background:var(--sage); border-color:var(--sage);}
  .blockrow{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
  .blockrow:last-child{border-bottom:none;}
  .blockrow .bname{font-size:16px;}
  .blockrow .btime{font-size:13px; color:var(--ivory-dim); display:block;}
  .togglechip{width:64px; text-align:center; padding:11px 6px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--ivory-dim); font-size:15px; font-weight:700; cursor:pointer;}
  .togglechip.active{background:var(--sage); border-color:var(--sage); color:#fff;}
  .themebtn{cursor:pointer; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; border:1px solid var(--line); border-radius:20px; padding:6px 11px; color:var(--ivory-dim); white-space:nowrap;}
  .empty{text-align:center; padding:36px 10px; color:var(--ivory-dim); font-size:16px; line-height:1.6;}
  .note{font-size:14px; color:var(--ivory-dim); line-height:1.6; margin-top:14px;}
  .home-round{display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .home-round .meta{font-size:13px; color:var(--ivory-dim); margin-top:2px;}
  .home-round .rval{font-size:20px; font-weight:700;}
  .tag{display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--brass-dim); color:var(--brass); margin-left:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* Uses the browser's own localStorage — this file runs standalone in Safari,
   outside Claude's environment. Same pattern as the other companion apps. */

const HEIGHT_IN = 70; // 5'10", from the protocol doc
const FLUID_TARGET = [120,150];
const WEIGHT_TARGET = [167,170];
const WAIST_HEIGHT_TARGET = 0.50;

const BLOCKS = [
  {key:'fasted', name:'Fasted', time:'On waking'},
  {key:'collagen', name:'Collagen', time:'After the walk'},
  {key:'hydration', name:'Hydration', time:'During AM training'},
  {key:'shake1', name:'Shake 1', time:'Post-workout'},
  {key:'meal1', name:'Meal 1 + Shake 2', time:'2–3 PM'},
  {key:'meal2', name:'Meal 2', time:'Before 7 PM'},
  {key:'night', name:'Night Block', time:'30–60 min pre-bed'},
];
const EXTRA_TOGGLES = [
  {key:'d3', name:'Vitamin D3', time:'With Shake 1 — tracking while dose is under review'},
];
const TRAINING_CARDS = [
  {key:'1', label:'1', name:'Upper A'},
  {key:'2', label:'2', name:'Lower A'},
  {key:'3', label:'3', name:'Rotational / ATG'},
  {key:'4', label:'4', name:'Upper B'},
  {key:'5', label:'5', name:'Lower B'},
  {key:'6', label:'6', name:'Zone 2'},
  {key:'7', label:'7', name:'Full Rest'},
  {key:'9-10', label:'9&10', name:'ATG Knee'},
];
// Weekly Rotation — mirrors the master reference card in Training Cards — Gym.
// Indexed by JS Date.getDay(): 0=Sun, 1=Mon, ... 6=Sat.
const WEEKLY_ROTATION = [
  { cards:['7'],      note:'Full Rest & Spinal Decompression — full nervous system reset before the week starts over.' },           // Sun
  { cards:['1','9-10'], note:'Upper A + ATG — pull-up Bottom Block starts the week fresh.' },                                        // Mon
  { cards:['2'],      note:'Lower A — Single-Arm Clean & Press, squat/hinge work.' },                                                 // Tue
  { cards:['3','9-10'], note:'Rotational/ATG + ATG — a lighter CNS day between two heavy lifting days.' },                            // Wed
  { cards:['4'],      note:'Upper B — pull-up Middle + Top Block, your priority range.' },                                            // Thu
  { cards:['5','9-10'], note:'Lower B + ATG — completes ATG\'s 3x/week target on schedule.' },                                        // Fri
  { cards:['6'],      note:'Zone 2 / Golf — optional pull-up skill touch here, only if fresh.' },                                     // Sat
];
function todaysRotation(dateStr){
  // dateStr expected as YYYY-MM-DD (local); falls back to real today if unparseable.
  let d;
  if(dateStr && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)){
    const [y,m,day] = dateStr.split('-').map(Number);
    d = new Date(y, m-1, day);
  } else {
    d = new Date();
  }
  return WEEKLY_ROTATION[d.getDay()];
}
function rotationCardLabel(key){
  const c = TRAINING_CARDS.find(x=>x.key===key);
  return c ? `${c.label} (${c.name})` : key;
}

/* ================= State & storage ================= */
let dailyLogs = [], checkpoints = [];
const DAILY_KEY='nutrition_daily_v1', CHECK_KEY='nutrition_checkpoints_v1', THEME_KEY='nutrition_theme_v1', SEEDED_KEY='nutrition_seeded_v1';

async function loadState(){
  try{ const d = localStorage.getItem(DAILY_KEY); dailyLogs = d? JSON.parse(d):[]; }catch(e){ dailyLogs=[]; }
  try{ const c = localStorage.getItem(CHECK_KEY); checkpoints = c? JSON.parse(c):[]; }catch(e){ checkpoints=[]; }
  if(!localStorage.getItem(SEEDED_KEY)){
    // Seed the protocol doc's own baseline numbers so the trend has a starting point.
    dailyLogs.push({id:'seed-d1', date:'2026-08-21', weight:183, blocks:null, fluidOz:null, isBaseline:true});
    checkpoints.push({id:'seed-c1', date:'2026-07-14', totalWeight:186.5, leanMass:128.7, fatMass:51.2, bodyFatPct:27.5, waistIn:35.5, isBaseline:true});
    await saveDaily(); await saveCheck();
    try{ localStorage.setItem(SEEDED_KEY,'1'); }catch(e){}
  }
}
async function saveDaily(){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyLogs)); }catch(e){} }
async function saveCheck(){ try{ localStorage.setItem(CHECK_KEY, JSON.stringify(checkpoints)); }catch(e){} }
async function loadTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    const parsed = t? JSON.parse(t):null;
    document.body.setAttribute('data-theme', (parsed&&parsed.mode)||'sun');
  }catch(e){ document.body.setAttribute('data-theme','sun'); }
}
async function cycleTheme(){
  const order=['sun','shade','dark','hc'];
  const cur = document.body.getAttribute('data-theme')||'sun';
  const next = order[(order.indexOf(cur)+1)%order.length];
  document.body.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, JSON.stringify({mode:next})); }catch(e){}
  render();
}
function themeToggleBtn(){
  const cur = document.body.getAttribute('data-theme')||'sun';
  const labels = {dark:'☾ Dusk', shade:'⛅ Shade', sun:'☀ Bright Sun', hc:'◐ High Contrast'};
  return `<span onclick="cycleTheme()" class="themebtn">${labels[cur]}</span>`;
}

/* ================= Derived stats ================= */
function waistToHeight(waistIn){ return waistIn!=null ? waistIn/HEIGHT_IN : null; }
function sortedChecks(){ return checkpoints.slice().sort((a,b)=>a.date.localeCompare(b.date)); }
function sortedDaily(){ return dailyLogs.slice().sort((a,b)=>a.date.localeCompare(b.date)); }

function checkpointTrend(){
  const list = sortedChecks();
  if(list.length===0) return null;
  const baseline = list[0], latest = list[list.length-1];
  return {
    baseline, latest,
    leanDelta: latest.leanMass - baseline.leanMass,
    waistRatioLatest: waistToHeight(latest.waistIn),
    waistRatioBaseline: waistToHeight(baseline.waistIn),
    hasMultiple: list.length>1
  };
}
function weeklyAdherence(){
  const real = sortedDaily().filter(d=>!d.isBaseline && d.blocks);
  const last7 = real.slice(-7);
  let hit=0, possible=0;
  last7.forEach(d=>{ BLOCKS.forEach(b=>{ possible++; if(d.blocks[b.key]) hit++; }); });
  return {hit, possible, days:last7.length};
}
function d3Adherence(){
  const real = sortedDaily().filter(d=>!d.isBaseline && d.blocks);
  const last7 = real.slice(-7);
  const hit = last7.filter(d=>d.blocks.d3).length;
  return {hit, days:last7.length};
}
function trainingSummary(){
  const real = sortedDaily().filter(d=>!d.isBaseline);
  const last7 = real.slice(-7);
  const trainedDays = last7.filter(d=>d.cards && d.cards.length>0).length;
  const last = real.slice().reverse().find(d=>d.cards && d.cards.length>0);
  const lastCardNames = last ? last.cards.map(k=>{ const c=TRAINING_CARDS.find(x=>x.key===k); return c?c.label:k; }).join(', ') : null;
  return {trainedDays, days:last7.length, lastDate: last? last.date: null, lastCardNames};
}
function latestWeight(){
  const list = sortedDaily();
  return list.length ? list[list.length-1] : null;
}

/* ================= Render ================= */
const app = document.getElementById('app');
let view='home', editBlocks=null, editDaily=null, detailId=null, detailType=null;

function render(){
  if(view==='home') return renderHome();
  if(view==='new-daily') return renderNewDaily();
  if(view==='new-check') return renderNewCheck();
  if(view==='detail') return renderDetail();
  if(view==='help') return renderHelp();
}

function renderHome(){
  let html = `<div class="brand"><h1>Nutrition & Workout</h1>${themeToggleBtn()}</div>`;
  html += `<button class="btn" onclick="goto('new-daily')">Log Today</button>`;
  html += `<button class="btn secondary" onclick="goto('new-check')">Log DEXA / Body-Comp Checkpoint</button>`;
  html += `<button class="btn secondary" onclick="goto('help')">How to Use</button>`;

  // Today's rotation
  const rot = todaysRotation();
  const rotNames = rot.cards.map(rotationCardLabel).join('  +  ');
  html += `<div class="board" style="margin-top:22px; border-color: var(--brass-dim);">
    <h4>Today's Card — Weekly Rotation</h4>
    <div class="cat-row"><span class="cname">Suggested</span><span class="cval num zero" style="font-size:16px;">${rotNames}</span><span class="ctarget"></span></div>
    <div class="note" style="margin-top:2px;">${rot.note} Card 0 runs today regardless, as always.</div>
  </div>`;

  // Body comp trend
  const ct = checkpointTrend();
  if(ct){
    html += `<div class="board" style="margin-top:22px;">
      <h4>Body Composition${ct.hasMultiple?'':' <span class="tag">Baseline Only</span>'}</h4>
      <div class="cat-row"><span class="cname">Lean Mass</span><span class="cval num ${ct.hasMultiple?(ct.leanDelta>0?'pos':(ct.leanDelta<0?'neg':'zero')):'zero'}">${ct.latest.leanMass.toFixed(1)} lb</span><span class="ctarget">${ct.hasMultiple?(ct.leanDelta>=0?'+':'')+ct.leanDelta.toFixed(1)+' vs baseline':'baseline: '+ct.baseline.leanMass.toFixed(1)}</span></div>
      <div class="cat-row"><span class="cname">Fat Mass</span><span class="cval num zero">${ct.latest.fatMass.toFixed(1)} lb</span><span class="ctarget">baseline ${ct.baseline.fatMass.toFixed(1)}</span></div>
      <div class="cat-row"><span class="cname">Body Fat %</span><span class="cval num zero">${ct.latest.bodyFatPct.toFixed(1)}%</span><span class="ctarget">baseline ${ct.baseline.bodyFatPct.toFixed(1)}%</span></div>
      <div class="cat-row"><span class="cname">Waist:Height</span><span class="cval num ${ct.waistRatioLatest<WAIST_HEIGHT_TARGET?'pos':'neg'}">${ct.waistRatioLatest.toFixed(3)}</span><span class="ctarget">&lt; ${WAIST_HEIGHT_TARGET.toFixed(2)}</span></div>
    </div>`;
  }

  // Weight trend
  const lw = latestWeight();
  if(lw){
    html += `<div class="board">
      <h4>Weight${lw.isBaseline?' <span class="tag">Baseline Only</span>':''}</h4>
      <div class="cat-row"><span class="cname">Latest</span><span class="cval num zero">${lw.weight} lb</span><span class="ctarget">target ${WEIGHT_TARGET[0]}–${WEIGHT_TARGET[1]} lb</span></div>
    </div>`;
  }

  // Weekly adherence
  const wa = weeklyAdherence();
  const d3a = d3Adherence();
  const ts = trainingSummary();
  if(wa.days>0){
    html += `<div class="board">
      <h4>Supplement Blocks — Last ${wa.days} Logged Day${wa.days===1?'':'s'}</h4>
      <div class="cat-row"><span class="cname">Blocks Hit</span><span class="cval num zero">${wa.hit}/${wa.possible}</span><span class="ctarget">${wa.possible?Math.round(100*wa.hit/wa.possible):0}%</span></div>
      <div class="cat-row"><span class="cname">Vitamin D3</span><span class="cval num zero">${d3a.hit}/${d3a.days} days</span><span class="ctarget">under dose review</span></div>
    </div>`;
  }
  if(ts.days>0){
    html += `<div class="board">
      <h4>Training — Last ${ts.days} Logged Day${ts.days===1?'':'s'}</h4>
      <div class="cat-row"><span class="cname">Days Trained</span><span class="cval num zero">${ts.trainedDays}/${ts.days}</span><span class="ctarget"></span></div>
      ${ts.lastDate?`<div class="cat-row"><span class="cname">Last Session</span><span class="cval num zero" style="font-size:15px;">${ts.lastCardNames}</span><span class="ctarget">${ts.lastDate}</span></div>`:''}
    </div>`;
  }

  html += `<h3 style="margin-top:22px; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); font-family:'Inter',sans-serif;">Past Entries</h3>`;
  const allEntries = [
    ...dailyLogs.map(d=>({...d, _type:'daily'})),
    ...checkpoints.map(c=>({...c, _type:'check'}))
  ].sort((a,b)=>b.date.localeCompare(a.date));
  if(allEntries.length===0){ html += `<div class="empty">Nothing logged yet.</div>`; }
  else{
    allEntries.forEach(e=>{
      if(e._type==='daily'){
        html += `<div class="home-round" onclick="viewDetail('${e.id}','daily')"><div><div>Daily${e.isBaseline?' · baseline':''}</div><div class="meta">${e.date}</div></div><div class="rval num">${e.weight} lb</div></div>`;
      } else {
        html += `<div class="home-round" onclick="viewDetail('${e.id}','check')"><div><div>DEXA / Body-Comp${e.isBaseline?' · baseline':''}</div><div class="meta">${e.date}</div></div><div class="rval num">${e.leanMass.toFixed(1)} lb lean</div></div>`;
      }
    });
  }
  app.innerHTML = html;
}

function renderNewDaily(){
  const today = new Date().toISOString().slice(0,10);
  editBlocks = editBlocks || {fasted:false, collagen:false, hydration:false, shake1:false, meal1:false, meal2:false, night:false, d3:false};
  editDaily = editDaily || {date:today, weight:'', fluidOz:'', cards:[...todaysRotation(today).cards], deload:false};
  app.innerHTML = `
    <div class="brand"><h1>Log Today</h1>${themeToggleBtn()}</div>
    <div class="field"><label>Date</label><input type="text" id="dateInput" value="${editDaily.date}" oninput="editDaily.date=this.value"></div>
    <div class="field"><label>Weight (lb)</label><input type="number" inputmode="decimal" id="weightInput" value="${editDaily.weight}" placeholder="e.g. 182.4" oninput="editDaily.weight=this.value"></div>
    <div class="board">
      <h4>Blocks Completed</h4>
      ${BLOCKS.map(b=>`<div class="blockrow"><div><span class="bname">${b.name}</span><span class="btime">${b.time}</span></div><div class="togglechip ${editBlocks[b.key]?'active':''}" onclick="toggleBlock('${b.key}')">${editBlocks[b.key]?'✓ Yes':'No'}</div></div>`).join('')}
    </div>
    <div class="board">
      <h4>Supplement Watch</h4>
      ${EXTRA_TOGGLES.map(b=>`<div class="blockrow"><div><span class="bname">${b.name}</span><span class="btime">${b.time}</span></div><div class="togglechip ${editBlocks[b.key]?'active':''}" onclick="toggleBlock('${b.key}')">${editBlocks[b.key]?'✓ Yes':'No'}</div></div>`).join('')}
    </div>
    <div class="board">
      <h4>Training — Card(s) Done Today</h4>
      <div class="hint" style="margin-bottom:10px;">Rotation for ${editDaily.date}: ${todaysRotation(editDaily.date).cards.map(rotationCardLabel).join('  +  ')} — pre-checked below, adjust if your day went differently.</div>
      <div class="chip-row">${TRAINING_CARDS.map(c=>`<div class="chip ${editDaily.cards.includes(c.key)?'active':''}" onclick="toggleCard('${c.key}')">${c.label}<br><span style="font-size:11px; font-weight:400;">${c.name}</span></div>`).join('')}</div>
      <div class="blockrow" style="margin-top:8px;"><div><span class="bname">Deload Week</span></div><div class="togglechip ${editDaily.deload?'active':''}" onclick="toggleDeload()">${editDaily.deload?'✓ Yes':'No'}</div></div>
    </div>
    <div class="field"><label>Fluid (oz, optional)</label><input type="number" inputmode="numeric" id="fluidInput" value="${editDaily.fluidOz}" placeholder="target ${FLUID_TARGET[0]}–${FLUID_TARGET[1]}" oninput="editDaily.fluidOz=this.value"></div>
    <button class="btn" onclick="saveDailyEntry()">Save</button>
    <button class="btn secondary" onclick="cancelDaily()">Cancel</button>
  `;
}
function toggleBlock(key){ editBlocks[key] = !editBlocks[key]; render(); }
function toggleCard(key){
  const i = editDaily.cards.indexOf(key);
  if(i>=0) editDaily.cards.splice(i,1); else editDaily.cards.push(key);
  render();
}
function toggleDeload(){ editDaily.deload = !editDaily.deload; render(); }
function cancelDaily(){ editBlocks=null; editDaily=null; goto('home'); }
async function saveDailyEntry(){
  const date = (editDaily.date||'').trim();
  const weight = parseFloat(editDaily.weight);
  const fluidOz = editDaily.fluidOz===''||editDaily.fluidOz==null ? null : parseFloat(editDaily.fluidOz);
  if(isNaN(weight)){ const el=document.getElementById('weightInput'); if(el) el.style.borderColor='var(--neg)'; return; }
  dailyLogs.push({id:'d'+Date.now(), date, weight, blocks:{...editBlocks}, fluidOz, cards:[...editDaily.cards], deload:editDaily.deload, isBaseline:false});
  editBlocks=null; editDaily=null;
  await saveDaily();
  goto('home');
}

function renderNewCheck(){
  const today = new Date().toISOString().slice(0,10);
  app.innerHTML = `
    <div class="brand"><h1>DEXA / Body-Comp</h1>${themeToggleBtn()}</div>
    <div class="field"><label>Date</label><input type="text" id="cDateInput" value="${today}"></div>
    <div class="field"><label>Total Weight (lb)</label><input type="number" inputmode="decimal" id="cTotalInput" placeholder="e.g. 183.0"></div>
    <div class="field"><label>Lean Mass (lb)</label><input type="number" inputmode="decimal" id="cLeanInput" placeholder="e.g. 130.0"></div>
    <div class="field"><label>Fat Mass (lb)</label><input type="number" inputmode="decimal" id="cFatInput" placeholder="e.g. 49.0"></div>
    <div class="field"><label>Body Fat %</label><input type="number" inputmode="decimal" id="cPctInput" placeholder="e.g. 26.0"></div>
    <div class="field"><label>Waist (inches)</label><input type="number" inputmode="decimal" id="cWaistInput" placeholder="e.g. 35.0">
      <div class="hint">Height is fixed at 5'10" (70") per the protocol doc — waist:height computes automatically.</div>
    </div>
    <button class="btn" onclick="saveCheckEntry()">Save</button>
    <button class="btn secondary" onclick="goto('home')">Cancel</button>
  `;
}
async function saveCheckEntry(){
  const date = document.getElementById('cDateInput').value.trim();
  const totalWeight = parseFloat(document.getElementById('cTotalInput').value);
  const leanMass = parseFloat(document.getElementById('cLeanInput').value);
  const fatMass = parseFloat(document.getElementById('cFatInput').value);
  const bodyFatPct = parseFloat(document.getElementById('cPctInput').value);
  const waistIn = parseFloat(document.getElementById('cWaistInput').value);
  if([totalWeight,leanMass,fatMass,bodyFatPct,waistIn].some(v=>isNaN(v))){ return; }
  checkpoints.push({id:'c'+Date.now(), date, totalWeight, leanMass, fatMass, bodyFatPct, waistIn, isBaseline:false});
  await saveCheck();
  goto('home');
}

function viewDetail(id, type){ detailId=id; detailType=type; view='detail'; render(); }
function renderDetail(){
  let html = `<div class="brand"><h1>Entry Detail</h1>${themeToggleBtn()}</div>`;
  if(detailType==='daily'){
    const d = dailyLogs.find(x=>x.id===detailId);
    html += `<div class="note" style="margin-top:-10px;">${d.date}${d.isBaseline?' · baseline (from protocol doc)':''}</div>`;
    html += `<div class="board"><div class="cat-row"><span class="cname">Weight</span><span class="cval num zero">${d.weight} lb</span><span class="ctarget"></span></div>`;
    if(d.fluidOz!=null) html += `<div class="cat-row"><span class="cname">Fluid</span><span class="cval num zero">${d.fluidOz} oz</span><span class="ctarget">target ${FLUID_TARGET[0]}–${FLUID_TARGET[1]}</span></div>`;
    html += `</div>`;
    if(d.blocks){
      html += `<div class="board"><h4>Blocks Completed</h4>${BLOCKS.map(b=>`<div class="blockrow"><span class="bname">${b.name}</span><span class="togglechip ${d.blocks[b.key]?'active':''}">${d.blocks[b.key]?'✓ Yes':'No'}</span></div>`).join('')}</div>`;
      html += `<div class="board"><h4>Supplement Watch</h4>${EXTRA_TOGGLES.map(b=>`<div class="blockrow"><span class="bname">${b.name}</span><span class="togglechip ${d.blocks[b.key]?'active':''}">${d.blocks[b.key]?'✓ Yes':'No'}</span></div>`).join('')}</div>`;
      const cardNames = (d.cards||[]).map(k=>{ const c=TRAINING_CARDS.find(x=>x.key===k); return c?`${c.label} (${c.name})`:k; });
      html += `<div class="board"><h4>Training</h4><div class="cat-row"><span class="cname">Card(s)</span><span class="cval num zero" style="font-size:15px;">${cardNames.length?cardNames.join(', '):'None logged'}</span><span class="ctarget"></span></div>${d.deload?'<div class="cat-row"><span class="cname">Deload Week</span><span class="cval num zero">Yes</span><span class="ctarget"></span></div>':''}</div>`;
    }
  } else {
    const c = checkpoints.find(x=>x.id===detailId);
    html += `<div class="note" style="margin-top:-10px;">${c.date}${c.isBaseline?' · baseline (from protocol doc)':''}</div>`;
    html += `<div class="board">
      <div class="cat-row"><span class="cname">Total Weight</span><span class="cval num zero">${c.totalWeight.toFixed(1)} lb</span><span class="ctarget"></span></div>
      <div class="cat-row"><span class="cname">Lean Mass</span><span class="cval num zero">${c.leanMass.toFixed(1)} lb</span><span class="ctarget"></span></div>
      <div class="cat-row"><span class="cname">Fat Mass</span><span class="cval num zero">${c.fatMass.toFixed(1)} lb</span><span class="ctarget"></span></div>
      <div class="cat-row"><span class="cname">Body Fat %</span><span class="cval num zero">${c.bodyFatPct.toFixed(1)}%</span><span class="ctarget"></span></div>
      <div class="cat-row"><span class="cname">Waist</span><span class="cval num zero">${c.waistIn.toFixed(1)} in</span><span class="ctarget"></span></div>
      <div class="cat-row"><span class="cname">Waist:Height</span><span class="cval num ${waistToHeight(c.waistIn)<WAIST_HEIGHT_TARGET?'pos':'neg'}">${waistToHeight(c.waistIn).toFixed(3)}</span><span class="ctarget">&lt; ${WAIST_HEIGHT_TARGET.toFixed(2)}</span></div>
    </div>`;
  }
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:16px;">Back to Home</button>`;
  app.innerHTML = html;
}

function renderHelp(){
  const step = (n,title,body) => `<div class="board" style="padding:12px 14px;">
    <div style="display:flex; gap:10px; align-items:baseline; margin-bottom:6px;">
      <span class="num" style="color:var(--brass); font-weight:700; font-size:17px;">${n}</span>
      <span style="font-weight:600; font-size:16px;">${title}</span>
    </div>
    <div style="font-size:15px; color:var(--ivory-dim); line-height:1.55;">${body}</div>
  </div>`;
  let html = `<div class="brand"><h1>How to Use</h1>${themeToggleBtn()}</div>`;
  html += step('1','Daily entry','Log Today → weight, tap each block Yes/No as you actually hit it, tap whichever gym card(s) you did (plus Deload Week if it applies), optional fluid ounces. Takes a few seconds.');
  html += step('2','DEXA / body-comp checkpoints','Whenever you get a new scan, log DEXA / Body-Comp with the numbers straight off the report. Waist:height computes itself from a waist measurement — height is fixed at 5\'10" per the protocol.');
  html += step('3','What the colors mean','Lean Mass and Waist:Height are colored against the protocol\'s own stated goals — lean mass trending up, waist:height under 0.50. Everything else (weight, fat mass, body fat %, fluid, block count) is shown for reference only, no judgment attached — this app tracks the numbers, it does not interpret them.');
  html += step('4','Baseline entries','The 7/14/26 DEXA scan and the most recent logged weight from the protocol doc are pre-loaded as a starting point, tagged "baseline" so they are never mistaken for something you logged yourself.');

  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const rotationGrid = WEEKLY_ROTATION.map((r,i)=>{
    const names = r.cards.map(rotationCardLabel).join(' + ');
    return `<div class="cat-row"><span class="cname">${DOW[i]}</span><span class="cval num zero" style="font-size:15px;">${names}</span><span class="ctarget"></span></div>`;
  }).join('');
  const step5Body = `
    <div style="margin-bottom:10px;">Home shows today's card automatically; Log Today pre-checks it. Full reasoning is on the Weekly Rotation reference card in Training Cards — Gym.</div>
    <div class="board" style="margin:0 0 10px; padding:8px 10px; background:var(--surface2);">${rotationGrid}</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <span class="tag">Card 0 · daily, no exceptions</span>
      <span class="tag">Card 8 · every 5th week, replaces 1/2/4/5</span>
    </div>
  `;
  html += step('5','Weekly Rotation', step5Body);
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:10px;">Back to Home</button>`;
  app.innerHTML = html;
}

function goto(v){ view=v; render(); }
loadTheme().then(()=>loadState().then(render));
</script>
</body>
</html>
