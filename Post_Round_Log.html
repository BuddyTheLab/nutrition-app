<style>
  :root{
    --bg:#161d18; --surface:#1f2a22; --surface2:#26332a; --line: rgba(237,232,220,0.12);
    --ivory:#EDE8DC; --ivory-dim: rgba(237,232,220,0.62);
    --brass:#C9A24B; --brass-dim: rgba(201,162,75,0.35);
    --sage:#7C9473; --pos:#8FB08A; --neg:#C1725A;
  }
  body[data-theme="shade"]{
    --bg:#E4E1D4; --surface:#F1EFE4; --surface2:#DAD6C6; --line: rgba(20,24,18,0.16);
    --ivory:#20241C; --ivory-dim: rgba(32,36,28,0.66);
    --brass:#8A6415; --brass-dim: rgba(138,100,21,0.38);
    --sage:#3E6B41; --pos:#256B31; --neg:#A6371F;
  }
  body[data-theme="sun"]{
    --bg:#FAFAF5; --surface:#FFFFFF; --surface2:#EFEDE2; --line: rgba(20,24,18,0.2);
    --ivory:#0F120C; --ivory-dim: rgba(15,18,12,0.72);
    --brass:#7A5A10; --brass-dim: rgba(122,90,16,0.42);
    --sage:#245A28; --pos:#166622; --neg:#8F2E19;
  }
  body[data-theme="hc"]{
    --bg:#000000; --surface:#0D0D0D; --surface2:#1A1A1A; --line: rgba(255,255,255,0.4);
    --ivory:#FFFFFF; --ivory-dim: rgba(255,255,255,0.92);
    --brass:#FFC72C; --brass-dim: rgba(255,199,44,0.55);
    --sage:#4ADE80; --pos:#4ADE80; --neg:#FF6B5C;
  }
  body[data-theme="shade"] .chip.active, body[data-theme="sun"] .chip.active{ color:#fff; }
  body[data-theme="shade"] .btn:not(.secondary):not(.ghost), body[data-theme="sun"] .btn:not(.secondary):not(.ghost){ color:#fff; }
  *{box-sizing:border-box;}
  html{width:100%; height:100%;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh; width:100%; -webkit-tap-highlight-color: transparent; padding-bottom:24px; transition:background 0.15s,color 0.15s;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:0.01em;}
  .brand{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand h1{font-size:22px; font-weight:600;}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .board{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 12px; margin-bottom:16px;}
  .board-total{display:flex; align-items:baseline; justify-content:space-between; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line);}
  .board-total .label{font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ivory-dim);}
  .board-total .val{font-size:40px; font-weight:700;}
  .cat-row{display:grid; grid-template-columns:1fr auto auto; gap:2px 10px; font-size:16px; padding:5px 0; align-items:baseline;}
  .cat-row .cname{color:var(--ivory-dim);}
  .cat-row .cval{font-size:17px; font-weight:600;}
  .cat-row .ctarget{font-size:13px; color:var(--ivory-dim);}
  .pos{color:var(--pos);} .neg{color:var(--neg);} .zero{color:var(--ivory-dim);}
  .btn{display:block; width:100%; text-align:center; background:var(--brass); color:#1a1408; border:none; border-radius:9px; font-family:'Inter',sans-serif; font-weight:600; font-size:19px; padding:17px 18px; cursor:pointer; margin-top:10px;}
  .btn:active{opacity:0.85;}
  .btn.secondary{background:transparent; color:var(--ivory); border:1px solid var(--line);}
  .btn.ghost{background:transparent; color:var(--brass); border:1px solid var(--brass-dim); padding:12px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ivory-dim); margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field select{ width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--ivory); border-radius:8px; padding:14px 12px; font-size:19px; font-family:'IBM Plex Mono',monospace;}
  .field input::placeholder{color:rgba(150,150,140,0.6); font-family:'Inter',sans-serif;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{flex:1 1 auto; min-width:60px; text-align:center; padding:13px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--ivory-dim); font-size:16px; font-weight:600; cursor:pointer;}
  .chip.active{background:var(--sage); border-color:var(--sage);}
  .themebtn{cursor:pointer; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; border:1px solid var(--line); border-radius:20px; padding:6px 11px; color:var(--ivory-dim); white-space:nowrap;}
  .empty{text-align:center; padding:36px 10px; color:var(--ivory-dim); font-size:16px; line-height:1.6;}
  .note{font-size:14px; color:var(--ivory-dim); line-height:1.6; margin-top:14px;}
  .home-round{display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .home-round .meta{font-size:13px; color:var(--ivory-dim); margin-top:2px;}
  .home-round .rscore{font-size:22px; font-weight:700;}

  /* ---- hole entry rows ---- */
  .holecard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px;}
  .holecard-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .holecard-top .hname{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .parchips{display:flex; gap:5px;}
  .parchip{width:34px; height:34px; line-height:34px; text-align:center; border-radius:7px; border:1px solid var(--line); background:var(--surface2); color:var(--ivory-dim); font-size:14px; font-weight:700; cursor:pointer;}
  .parchip.active{background:var(--brass); border-color:var(--brass); color:#1a1408;}
  body[data-theme="shade"] .parchip.active, body[data-theme="sun"] .parchip.active{ color:#fff; }
  .inputgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px;}
  .inputgrid .fld label{display:block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); margin-bottom:4px; text-align:center;}
  .inputgrid .fld input{width:100%; text-align:center; background:var(--surface2); border:1px solid var(--line); color:var(--ivory); border-radius:8px; padding:11px 4px; font-size:19px; font-family:'IBM Plex Mono',monospace;}
  .firrow{display:flex; gap:6px;}
  .firchip{flex:1; text-align:center; padding:9px 2px; border-radius:7px; border:1px solid var(--line); background:var(--surface2); color:var(--ivory-dim); font-size:13px; font-weight:700; cursor:pointer;}
  .firchip.active{background:var(--sage); border-color:var(--sage); color:#fff;}
  .firrow.dim{opacity:0.35; pointer-events:none;}
  .firlabel{font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); margin-bottom:4px;}
  .holecard.done{border-color:var(--sage);}
  .tag{display:inline-block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--brass-dim); color:var(--brass);}

  /* ---- summary table ---- */
  table.dbtable{width:100%; border-collapse:collapse; margin-top:6px; font-size:15px;}
  table.dbtable th{text-align:left; color:var(--ivory-dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; padding:7px 4px; border-bottom:1px solid var(--line);}
  table.dbtable td{padding:7px 4px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace;}
</style>
</head>

   the browser itself rather than any external storage API. Same pattern
   as the Strokes Gained tracker. */

/* ================= 12-Cap benchmark targets (Master On-Course Strategy Manual, 3.3) ================= */
const TARGETS = {
  score: {label:'Score', target:84, dir:'lte', fmt:v=>v==null?'—':v},
  fir: {label:'Fairways (FIR)', target:0.50, dir:'gte', fmt:pct},
  gir: {label:'Greens (GIR)', target:0.35, dir:'gte', fmt:pct},
  scrambling: {label:'Scrambling', target:0.35, dir:'gte', fmt:pct},
  penalties: {label:'Penalty Balls', target:0, dir:'lte', fmt:v=>v==null?'—':v},
  putts3: {label:'3-Putts', target:1, dir:'lte', fmt:v=>v==null?'—':v},
};
function pct(v){ return v==null ? '—' : Math.round(v*100)+'%'; }
function hitTarget(key, v, targetOverride){
  if(v==null) return 'zero';
  const t = TARGETS[key];
  const target = targetOverride!=null ? targetOverride : t.target;
  const ok = t.dir==='lte' ? v<=target : v>=target;
  return ok ? 'pos' : 'neg';
}

/* ================= State & storage ================= */
let rounds = [], active = null;
const STORE_KEY='roundlog_rounds_v1', ACTIVE_KEY='roundlog_active_v1', THEME_KEY='roundlog_theme_v1';
async function loadState(){
  try{ const r = localStorage.getItem(STORE_KEY); rounds = r? JSON.parse(r):[]; }catch(e){ rounds=[]; }
  try{ const a = localStorage.getItem(ACTIVE_KEY); active = a? JSON.parse(a):null; }catch(e){ active=null; }
}
async function saveRounds(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(rounds)); }catch(e){} }
async function saveActive(){ try{ localStorage.setItem(ACTIVE_KEY, active? JSON.stringify(active):'null'); }catch(e){} }
async function loadTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    const parsed = t? JSON.parse(t):null;
    document.body.setAttribute('data-theme', (parsed&&parsed.mode)||'sun');
  }catch(e){ document.body.setAttribute('data-theme','sun'); }
}
async function cycleTheme(){
  const order=['sun','shade','dark','hc'];
  const cur = document.body.getAttribute('data-theme')||'sun';
  const next = order[(order.indexOf(cur)+1)%order.length];
  document.body.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, JSON.stringify({mode:next})); }catch(e){}
  render();
}
function themeToggleBtn(){
  const cur = document.body.getAttribute('data-theme')||'sun';
  const labels = {dark:'☾ Dusk', shade:'⛅ Shade', sun:'☀ Bright Sun', hc:'◐ High Contrast'};
  return `<span onclick="cycleTheme()" class="themebtn">${labels[cur]}</span>`;
}

/* ================= Stats — derives GIR / 3-putts / scrambling / DB root cause ================= */
/* Scrambling uses the standard definition: par-or-better after missing the green in regulation. */
function computeRoundStats(round){
  let score=null, firYes=0, firTotal=0, girYes=0, girTotal=0, scrYes=0, scrTotal=0, putts3=0, penalties=0;
  const dbTags=[];
  let anyComplete=false;
  round.holes.forEach(h=>{
    if(h.score==null || h.putts==null || h.score==='' || h.putts===''){ return; }
    anyComplete=true;
    const s=Number(h.score), p=Number(h.putts), par=Number(h.par)||4, pen=Number(h.penalty)||0;
    score = (score||0) + s;
    penalties += pen;
    if(p>=3) putts3++;
    const toGreen = s - p;
    const gir = toGreen <= (par-2);
    girTotal++; if(gir) girYes++;
    if(par!==3 && h.fir){ firTotal++; if(h.fir==='Y') firYes++; }
    if(!gir){ scrTotal++; if(s<=par) scrYes++; }
    if(s >= par+2){ dbTags.push({hole:h.n, tag: pen>0?'P':(p>=3?'3P':'H')}); }
  });
  return {
    score: anyComplete?score:null,
    fir: firTotal? firYes/firTotal : null,
    gir: girTotal? girYes/girTotal : null,
    scrambling: scrTotal? scrYes/scrTotal : null,
    putts3: anyComplete?putts3:null,
    penalties: anyComplete?penalties:null,
    dbTags
  };
}
function averageStats(list){
  const keys=['fir','gir','scrambling'];
  const out={};
  keys.forEach(k=>{
    const vals = list.map(r=>computeRoundStats(r)[k]).filter(v=>v!=null);
    out[k] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  });
  // Score only averages across rounds matching the most recent round's hole count,
  // so a 9-hole league night doesn't silently skew an 18-hole average (or vice versa).
  const holesCount = list.length ? list[list.length-1].holesCount : 18;
  const scores = list.filter(r=>r.holesCount===holesCount).map(r=>computeRoundStats(r).score).filter(v=>v!=null);
  out.score = scores.length ? Math.round(10*scores.reduce((a,b)=>a+b,0)/scores.length)/10 : null;
  out.holesCount = holesCount;
  const p3 = list.map(r=>computeRoundStats(r).putts3).filter(v=>v!=null);
  out.putts3 = p3.length ? Math.round(10*p3.reduce((a,b)=>a+b,0)/p3.length)/10 : null;
  const pen = list.map(r=>computeRoundStats(r).penalties).filter(v=>v!=null);
  out.penalties = pen.length ? Math.round(10*pen.reduce((a,b)=>a+b,0)/pen.length)/10 : null;
  return out;
}
function fmt(n){ return (n>0?'+':'')+n.toFixed(2); }

/* ================= Render ================= */
const app = document.getElementById('app');
let view='home', detailId=null;

function render(){
  if(view==='home') return renderHome();
  if(view==='new') return renderNew();
  if(view==='log') return renderLog();
  if(view==='detail') return renderDetail(rounds.find(r=>r.id===detailId));
  if(view==='help') return renderHelp();
}

function statBoard(stats, showTargets, holesCount){
  const hc = holesCount||18;
  const scoreTarget = Math.round(84 * hc/18);
  const rows = ['score','fir','gir','scrambling','penalties','putts3'].map(k=>{
    const t = TARGETS[k];
    const target = (k==='score') ? scoreTarget : t.target;
    const label = (k==='score') ? `${hc}-Hole Score` : t.label;
    const cls = showTargets ? hitTarget(k, stats[k], target) : 'zero';
    return `<div class="cat-row"><span class="cname">${label}</span><span class="cval num ${cls}">${t.fmt(stats[k])}</span><span class="ctarget">${t.dir==='lte'?'≤':'≥'}${k==='score'?target:(k==='putts3'||k==='penalties'?target:pct(target))}</span></div>`;
  }).join('');
  return `<div class="board">${rows}</div>`;
}

function renderHome(){
  let html = `<div class="brand"><h1>Post Round Log</h1>${themeToggleBtn()}</div>`;
  if(active){
    html += `<button class="btn" onclick="resumeRound()">Resume — ${active.course||'Round'}</button>`;
  }
  html += `<button class="btn ${active?'secondary':''}" onclick="goto('new')">New Round</button>`;
  html += `<button class="btn secondary" onclick="goto('help')">How to Use</button>`;

  if(rounds.length>0){
    html += `<h3 style="margin-top:26px; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); font-family:'Inter',sans-serif;">Trend — Last ${Math.min(5,rounds.length)} Rounds</h3>`;
    const trend = averageStats(rounds.slice(-5));
    html += statBoard(trend, true, trend.holesCount);
  }

  html += `<h3 style="margin-top:26px; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ivory-dim); font-family:'Inter',sans-serif;">Past Rounds</h3>`;
  if(rounds.length===0){ html += `<div class="empty">No rounds logged yet.<br>Fill one in after your next round.</div>`; }
  else{
    rounds.slice().reverse().forEach(r=>{
      const s = computeRoundStats(r);
      html += `<div class="home-round" onclick="viewDetail('${r.id}')"><div><div>${r.course||'Round'}</div><div class="meta">${r.date}${r.holesCount?' · '+r.holesCount+' holes':''}</div></div><div class="rscore num">${s.score==null?'—':s.score}</div></div>`;
    });
  }
  app.innerHTML = html;
}

function renderNew(){
  window._nHoles = window._nHoles || 18;
  const today = new Date().toISOString().slice(0,10);
  app.innerHTML = `
    <div class="brand"><h1>New Round Log</h1>${themeToggleBtn()}</div>
    <div class="field"><label>Course</label>
      <input type="text" id="courseInput" list="courseList" placeholder="Course name">
      <datalist id="courseList">${[...new Set(rounds.map(r=>r.course).filter(Boolean))].map(c=>`<option value="${c}">`).join('')}</datalist>
    </div>
    <div class="field"><label>Date</label><input type="text" id="dateInput" value="${today}"></div>
    <div class="field"><label>Holes</label>
      <div class="chip-row">
        <div class="chip ${window._nHoles===9?'active':''}" onclick="pickHoles(9)">9</div>
        <div class="chip ${window._nHoles===18?'active':''}" onclick="pickHoles(18)">18</div>
      </div>
    </div>
    <button class="btn" onclick="startLog()">Start Log</button>
    <button class="btn secondary" onclick="goto('home')">Cancel</button>
  `;
}
function pickHoles(n){ window._nHoles=n; render(); }
async function startLog(){
  const course = document.getElementById('courseInput').value.trim();
  const date = document.getElementById('dateInput').value.trim();
  const n = window._nHoles || 18;
  const holes = [];
  for(let i=1;i<=n;i++){ holes.push({n:i, par:4, score:null, putts:null, fir:null, penalty:0}); }
  active = { id:'rl'+Date.now(), course, date, holesCount:n, holes };
  await saveActive();
  view='log'; render();
}
function resumeRound(){ view='log'; render(); }

function renderLog(){
  const stats = computeRoundStats(active);
  let html = `<div class="brand"><h1>${active.course||'Round'}</h1>${themeToggleBtn()}</div>
  <div class="note" style="margin-top:-10px; margin-bottom:16px;">${active.date} · ${active.holesCount} holes</div>`;
  html += statBoard(stats, true, active.holesCount);

  active.holes.forEach(h=>{
    const complete = h.score!=null && h.score!=='' && h.putts!=null && h.putts!=='';
    html += `<div class="holecard ${complete?'done':''}">
      <div class="holecard-top">
        <span class="hname">Hole ${h.n}</span>
        <div class="parchips">${[3,4,5].map(p=>`<div class="parchip ${h.par===p?'active':''}" onclick="setPar(${h.n},${p})">${p}</div>`).join('')}</div>
      </div>
      <div class="inputgrid">
        <div class="fld"><label>Score</label><input type="number" inputmode="numeric" value="${h.score==null?'':h.score}" oninput="setHoleVal(${h.n},'score',this.value)"></div>
        <div class="fld"><label>Putts</label><input type="number" inputmode="numeric" value="${h.putts==null?'':h.putts}" oninput="setHoleVal(${h.n},'putts',this.value)"></div>
        <div class="fld"><label>Penalty</label><input type="number" inputmode="numeric" value="${h.penalty||0}" oninput="setHoleVal(${h.n},'penalty',this.value)"></div>
      </div>
      <div class="firlabel">Fairway${h.par===3?' (n/a — par 3)':''}</div>
      <div class="firrow ${h.par===3?'dim':''}">${['Y','L','R','T'].map(f=>`<div class="firchip ${h.fir===f?'active':''}" onclick="setFir(${h.n},'${f}')">${f}</div>`).join('')}</div>
    </div>`;
  });

  html += `<button class="btn" onclick="finishLog()">Save Round</button>
  <button class="btn ghost" onclick="goto('home')" style="margin-top:8px;">Save &amp; Exit to Home</button>`;
  app.innerHTML = html;
}
function findHole(n){ return active.holes.find(h=>h.n===n); }
async function setPar(n,p){ findHole(n).par=p; await saveActive(); render(); }
async function setFir(n,f){ const h=findHole(n); h.fir = (h.fir===f)?null:f; await saveActive(); render(); }
async function setHoleVal(n,key,val){
  const h = findHole(n);
  h[key] = val===''? null : Number(val);
  await saveActive();
  // light-touch: only refresh the top stat board + done-state, not the whole scroll position
  const statsHtml = document.querySelector('.board');
  if(statsHtml) statsHtml.outerHTML = statBoard(computeRoundStats(active), true, active.holesCount);
}
async function finishLog(){
  rounds.push(active);
  await saveRounds();
  active = null; await saveActive();
  view='home'; render();
}

function dbTable(stats){
  if(stats.dbTags.length===0) return '';
  const rows = stats.dbTags.map(t=>`<tr><td>Hole ${t.hole}</td><td>${t.tag==='P'?'Penalty':t.tag==='3P'?'3-Putt':'Other / recovery'}</td></tr>`).join('');
  return `<h3 style="margin-top:22px; font-size:15px;">Double-Bogey+ Root Cause</h3>
  <table class="dbtable"><thead><tr><th>Hole</th><th>Cause</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderDetail(round){
  const stats = computeRoundStats(round);
  let html = `<div class="brand"><h1>${round.course||'Round'}</h1>${themeToggleBtn()}</div>
  <div class="note" style="margin-top:-10px;">${round.date} · ${round.holesCount} holes</div>`;
  html += statBoard(stats, true, round.holesCount);
  html += dbTable(stats);
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:16px;">Back to Home</button>`;
  app.innerHTML = html;
}
function viewDetail(id){ detailId=id; view='detail'; render(); }

function renderHelp(){
  const step = (n,title,body) => `<div class="board" style="padding:12px 14px;">
    <div style="display:flex; gap:10px; align-items:baseline; margin-bottom:6px;">
      <span class="num" style="color:var(--brass); font-weight:700; font-size:17px;">${n}</span>
      <span style="font-weight:600; font-size:16px;">${title}</span>
    </div>
    <div style="font-size:15px; color:var(--ivory-dim); line-height:1.55;">${body}</div>
  </div>`;
  let html = `<div class="brand"><h1>How to Use</h1>${themeToggleBtn()}</div>`;
  html += step('1','After the round','Home → New Round Log. Type the course, date, and pick 9 or 18 holes.');
  html += step('2','Transcribe from your backup card','For each hole: Score and Putts (you already have these), Penalty strokes if any, and Fairway — Y (hit), L/R (missed left/right rough), or T (trees). Skip Fairway on par 3s, it is not counted there.');
  html += step('3','Everything else is automatic','GIR, 3-putts, Scrambling %, and the double-bogey root cause (Penalty / 3-Putt / Other) are all computed from what you typed — nothing extra to tag.');
  html += step('4','Save','Tap Save Round. It joins Past Rounds and folds into the 5-round trend on the home screen.');
  html += step('5','Reading the numbers','Green = at or better than the 12-cap target from the On-Course Card. Red = short of it. Watch the trend over rounds, not any single one.');
  html += `<button class="btn secondary" onclick="goto('home')" style="margin-top:10px;">Back to Home</button>`;
  app.innerHTML = html;
}

function goto(v){ view=v; render(); }
loadTheme().then(()=>loadState().then(render));
</script>
</body>
</html>
